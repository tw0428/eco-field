<script>
// 程式出錯時直接顯示在右上角狀態（避免只看到「連線中…」）
window.addEventListener("error",e=>{const c=document.getElementById("conn");if(c)c.textContent="程式錯誤："+(e.message||"未知")+(e.lineno?"（第"+e.lineno+"行）":"")});

// LINE內建瀏覽器跟Safari分開存金鑰與定位權限 → 自動改用外部瀏覽器開（LINE支援 openExternalBrowser=1）
if(/\bLine\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search)){const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');location.replace(u.href)}
// 同事分享連結 #k=金鑰：存進這支手機後從網址拿掉（#後面的內容不會送到任何伺服器）
else{const m=location.hash.match(/[#&]k=([^&]+)/);if(m){try{localStorage.setItem('gh-token',decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}}
// 網頁存手機（sw.js）：有新版時顯示提示條，點了才換新版
if('serviceWorker' in navigator&&location.protocol==='https:'){
 navigator.serviceWorker.onmessage=e=>{if(!e.data||e.data.type!=='update'||document.getElementById('updBar'))return;
  const b=document.createElement('button');b.id='updBar';b.type='button';b.textContent='有新版本，點這裡更新';
  b.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:14px;border-radius:10px;border:0;background:#2f6b4f;color:#fff;font:inherit;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)';
  b.onclick=()=>{flush().finally(()=>location.reload())};document.body.appendChild(b)};
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// ↻ 時順便檢查工具本身：網路上的版本（內嵌程式與樣式）和現在跑的不同，就換進手機副本並重新載入
const appSig=d=>[...d.querySelectorAll('script:not([src]),style')].map(e=>e.textContent).join('\n');
let appSigNow=null;document.addEventListener('DOMContentLoaded',()=>{appSigNow=appSig(document)});
async function appUpd(){
 try{const p=location.pathname.split('/').pop()||'index.html';
  const r=await fetch(p+'?swbypass='+Date.now(),{cache:'no-store'});if(!r.ok||appSigNow==null)return false;
  const t=await r.text();if(appSig(new DOMParser().parseFromString(t,'text/html'))===appSigNow)return false;
  const c=await caches.open('eco-pages-v2'); // 與 sw.js 的 CACHE 同名
  await c.put(p,new Response(t,{headers:{'Content-Type':'text/html; charset=utf-8'}}));return true
 }catch(e){return false}
}
</script>
<style>

<body>
<header>
<div class="top"><h1>棲地評估算分</h1><span class="status"><a href="./">現場紀錄</a>｜<span id="conn">連線中…</span> <a href="#" id="reloadBtn">↻</a></span></div>
<div class="sub"><label for="whoIn">紀錄者</label><input type="text" id="whoIn" placeholder="你的名字" autocomplete="name"><a href="#" id="expLink" style="margin-left:auto">匯出</a><a href="#" id="shareBtn">分享給同事</a></div>
<div class="row" id="tokBox" hidden><input id="tokIn" type="password" placeholder="貼上 GitHub 金鑰 github_pat_… 或 ghp_…" style="flex:1" autocomplete="off"><button class="act primary" id="tokSave">儲存並連線</button></div>
<div class="row" id="caseBar" hidden><select id="caseSel" style="flex:1"></select><button class="act" id="caseAdd">新增</button><button class="act danger" id="caseDel">刪除</button></div>
<div class="row" id="caseAddRow" hidden><input id="caseName" type="text" placeholder="案件名稱" style="flex:1"><button class="act primary" id="caseSave">建立</button></div>

<div id="expSheet" class="sheet" hidden><div class="sheetbody"><div class="sheethead"><b style="font-size:17px">匯出</b><button class="act" id="expClose">關閉</button></div><div id="expBody" class="expbox"></div></div></div>

<script>
'use strict';
/* ===== 資料定義 ===== */
const BAND=['佳','良好','普通','差'];
const R20=[[16,20],[11,15],[6,10],[1,5]], R10=[[9,10],[6,8],[3,5],[1,2]];
const S20=[18,13,8,3], S10=[9,7,4,2];
const hb=(v,c)=>v>=c[0]?0:v>=c[1]?1:v>=c[2]?2:3;                 // 越高越好：下限含
const lb=(v,c,inc)=>{const t=inc?((a,b)=>a<=b):((a,b)=>a<b);return t(v,c[0])?0:t(v,c[1])?1:t(v,c[2])?2:3;}; // 越低越好：上限不含
const num=x=>(x===''||x==null||isNaN(+x))?null:+x;

const ADJ={
sub:{p:['粒徑≥3公尺巨石，或以大小漂石、圓石為主','生物可棲息空隙多','多倒木、漂流木、枯枝落葉與有機碎屑','完工後重新鋪石、拋石、棲地營造','基質上生長矽藻、苔蘚，或發現清潔水生昆蟲、蝦蟹魚類'],m:['底質主要為細顆粒（礫石、砂土、黏土）','溪床整平、漿砌、封底','移除大小漂石與>3公尺巨石','無生物利用']},
embed:{p:['溪水充沛，預計可快速帶走臨時沉積土砂','設沉砂池、施工遠離流水區、土包袋過濾'],m:['溪水濁度高','深潭易嚴重淤積土砂']},
flow:{p:['存在湍瀨或深潭','有粒徑≥3公尺大石巨石','瀨潭連續交錯','發現好高溶氧水生生物利用','完工後重新鋪石、拋石、棲地營造'],m:['缺乏連續湍瀨、深潭或岸邊緩流','形成漫流']},
riffle:{p:['目視可見連續湍瀨，或有>3公尺巨石、漂石、礫石或樹幹激起湍瀨（加1~2分）'],m:['目視無連續湍瀨且無巨石等天然物','溪流渠道化']},
depth:{p:['發現魚蝦蟹類利用','有水窪或深潭等避難所','水面覆蓋溪床比例超過75%'],m:['溪床整平、渠道化或混凝土封底，導致淺緩或漫流','上游有固定性引水設施（堰、混凝土設施）','與附近自然參考點比較水量明顯減少']},
bank:{p:['濱溪植被帶具完整多層次原生植被（喬、灌、草）','植被茂密鬱閉、幾無人為破壞','雖有破壞擾動但逐漸演替恢復','林相：天然林>人工林>竹林、果園>草生地>道路建物'],m:['僅灌叢與草本、缺乏喬木','明顯人為擾動（整地、砍伐、除草）','大樹因治理工程移除','外來入侵種拓殖']},
bw:{p:['多層次原生植被','茂密鬱閉、幾無人為破壞','濱溪植物帶與兩岸森林完整連接','雖有破壞但逐漸恢復','嚴格控制回填區裸露面小於3公尺'],m:['僅灌叢與草本','明顯人為擾動','大樹因治理工程移除','外來入侵種拓殖']},
wchg:{p:['全段或部分自然溪段、濱溪植被被保留','經復育後坡岸植被向溪流生長、裸露面寬度降低','設置低水流路或深槽區，提供灘地復育植生空間'],m:['溪床整平、壓實、混凝土封底','移除坡岸植被']},
long:{p:['橫向構造物材質具孔隙度與粗糙度','橫向構造物坡度低於45度','有改善縱向連結性之設計（如各型魚道）'],m:['視當地目標魚種上溯能力與構造物落差']},
lat:{p:['護岸每40公尺設置動物通道','動物通道連結自然棲地','濱溪植被帶恢復、阻隔降低','邊坡粗糙度高或為自然坡面'],m:[]}
};

/* 選項值＝落在該級距內的代表值，計算邏輯不變；舊資料/匯入的原始數值仍可用 */
const F=(k,label,opts)=>({k,label,opts});
const ITEMS=[
 {id:'sub',no:1,name:'溪床自然基質多樣性',max:20,fields:[F('v','理想基質占河道面積',[[80,'≥70%（佳）'],[55,'40~70%（良好）'],[30,'20~40%（普通）'],[10,'<20%（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:hb(v,[70,40,20])}}},
 {id:'embed',no:2,name:'河床底質包埋度',max:20,fields:[F('v','石礫被砂土包圍的體積',[[10,'<25%（佳）'],[35,'25~50%（良好）'],[60,'50~75%（普通）'],[90,'≥75%（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:lb(v,[25,50,75])}}},
 {id:'flow',no:3,name:'流速水深組合',max:20,dry:true,fields:[F('v','水型種數（淺瀨/淺流/深流/深潭/岸邊緩流）',[[5,'5種（佳）'],[4,'4種（佳）'],[3,'3種（良好）'],[2,'2種（普通）'],[1,'1種（差）'],[0,'0種（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:v>=4?0:v==3?1:v==2?2:3}}},
 {id:'riffle',no:4,name:'湍瀨出現頻率',max:20,dry:true,fields:[F('v','湍瀨間距÷河寬',[[3,'<7倍（佳）'],[10,'7~16倍（良好）'],[20,'16~25倍（普通）'],[30,'≥25倍（差）'],['none','未見湍瀨（差，免量測）']])],calc:s=>{if(s.t==='none'||s.v==='none')return {b:3,note:'未見湍瀨且無巨石激流，依原表判為「差」；可依扣分原則在1~5分內酌降'};const v=num(s.v);return v==null?null:{b:lb(v,[7,16,25])}}},
 {id:'depth',no:5,name:'河道水流狀態',max:20,dry:true,fields:[F('v','有效水深',[[40,'≥30 cm（佳）'],[20,'15~30 cm（良好）'],[10,'5~15 cm（普通）'],[2,'<5 cm（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:hb(v,[30,15,5])}}},

function lateral(s,high){
 const L=num(s.L),sl=num(s.sl),d=num(s.d);
 if(L==null&&sl==null&&d==null)return null;
 if(L==null||sl==null||d==null){
  const lv=L==null?0:(!high?(L>=30?0:L>=21?1:L>=11?2:3):(L>=20?0:L>=11?1:L>=6?2:3));
  const s0=sl==null?0:(!high?(sl<=30?0:sl<=40?1:sl<=60?2:3):(sl<=40?0:sl<=50?1:sl<=60?2:3));
  const d0=d==null?0:(d<=5?0:d<=10?1:d<=20?2:3);
  const best=Math.min(3,lv+Math.max(s0,d0));
  const miss=[L==null?'長度':'',sl==null?'坡度':'',d==null?'落差':''].filter(Boolean).join('、');
  return {pending:true,note:`尚缺${miss}（原表需三項同時判定）。依已選項目，最好只能到「${BAND[best]}」，不計入總分`};
 }
 // 表10/11：長度、坡度、落差各分0~3級；原表組合＝長度級＋坡度落差級（坡度與落差同級）
 // 坡度與落差不同級時取較差者（原表：優先考量坡度與最大落差），故級距＝長度級＋max(坡度級,落差級)
 let Lv,sv;
 if(!high){Lv=L>=30?0:L>=21?1:L>=11?2:3;sv=sl<=30?0:sl<=40?1:sl<=60?2:3;}
 else{Lv=L>=20?0:L>=11?1:L>=6?2:3;sv=sl<=40?0:sl<=50?1:sl<=60?2:3;}
 const dv=d<=5?0:d<=10?1:d<=20?2:3;
 const b=Math.min(3,Lv+Math.max(sv,dv));
 const why=Lv===3?'可通行長度不足':sv===3?'坡度>60°':dv===3?'落差>20 cm':'';
 return {b,note:(sv!==dv?'坡度與落差不同級，取較差者計。':'')+(why?why+'，判為差。':'')};
}

async function gh(path,opt={}){

  headers:{Authorization:'Bearer '+ghToken,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});

async function putB64(path,b64,sha,m){return gh(path,{method:'PUT',body:JSON.stringify({message:m||'update '+path,content:b64,...(sha?{sha}:{})})})}

let wq=Promise.resolve();
function serial(fn){const p=wq.then(fn,fn);wq=p.catch(()=>{});return p}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 讀最新→套用修改→寫回；別台裝置同時改過（衝突）時重讀重做
function mutate(path,fn){return serial(async()=>{
 for(let i=0;;i++){
  const {data,sha}=await getJson(path);const next=fn(data);
  try{if(next==null){if(sha)await gh(path,{method:'DELETE',body:JSON.stringify({message:'delete '+path,sha})});return null}
   await putB64(path,b64e(JSON.stringify(next,null,1)),sha);return next}
  catch(e){if(e.code!=='conflict'||i>=4)throw e;await sleep(800*(i+1))}
 }
})}
function putNew(path,b64,m){return serial(async()=>{

})}

async function hLoad(){

 try{
  const r=await fetch('https://api.github.com/graphql',{method:'POST',cache:'no-store',headers:{Authorization:'Bearer '+ghToken,'Content-Type':'application/json'},
   body:JSON.stringify({query:`query{repository(owner:"${GH_OWNER}",name:"eco-field-data"){h:object(expression:"HEAD:habitat"){... on Tree{entries{name object{... on Blob{text}}}}}}}`})});
  if(r.status===401){const e=new Error('401');e.code='bad_token';throw e}

   if(!repo&&(j.errors||[]).some(x=>x.type==='NOT_FOUND')){const e=new Error('no repo');e.code='no_repo';throw e}}

/* ===== 計算 ===== */
function evalItem(it,side,p){
 const key=it.id+(side||'');const st=p.creek[key]||{};
 const ctx={high:p.high};
 let r=it.calc(st,ctx);
 if(it.dry&&st.v==='dry')r={zero:true,note:'乾涸／斷流／伏流，0分'};
 if(!r||r.pending)return {key,st,empty:true,max:it.max,hint:r&&r.note};
 if(r.zero)return {key,st,zero:true,score:0,note:r.note,max:it.max};
 const rng=(it.max===20?R20:R10)[r.b],sug=(it.max===20?S20:S10)[r.b];
 let sc=st.ovr!=null&&st.ovrBand===r.b?Math.min(rng[1],Math.max(rng[0],st.ovr)):sug;
 return {key,st,b:r.b,rng,sug,score:sc,note:r.note,max:it.max};
}
function creekAll(p){
 const out=[];
 ITEMS.forEach(it=>{(it.sides?['L','R']:['']).forEach(sd=>out.push({it,sd,r:evalItem(it,sd,p)}))});
 return out;
}
function creekTotal(p){const a=creekAll(p);let t=0,n=0;a.forEach(x=>{if(x.r.score!=null){t+=x.r.score;n++}});return {t,n,all:a.length}}
const SLOPE=[
 {k:'w',name:'木本植物覆蓋度',opts:[[0,'0%（1分）'],[10,'<15%（2分）'],[30,'15~55%（3分）'],[70,'≥55%（4分）']],f:v=>v===0?1:v<15?2:v<55?3:4},
 {k:'sp',name:'植生種數',opts:[[10,'<15種/100m²（1分）'],[17,'15~20種（2分）'],[25,'20~30種（3分）'],[35,'≥30種（4分）']],f:v=>v<15?1:v<20?2:v<30?3:4},
 {k:'nat',name:'原生種覆蓋度',opts:[[5,'<10%（1分）'],[20,'10~30%（2分）'],[50,'30~65%（3分）'],[80,'≥65%（4分）']],f:v=>v<10?1:v<30?2:v<65?3:4},
 {k:'ly',name:'植物社會層次',sel:[[1,'一層或裸露'],[2,'二層'],[3,'三層'],[4,'四層以上']]},
 {k:'su',name:'演替階段',sel:[[1,'裸露或外來種優勢（拓殖期）'],[2,'初期草本優勢（初期）'],[3,'先驅樹種優勢（中期）'],[4,'中後期物種優勢（後期）']]}
];
function slopeEval(p){
 let t=0,n=0;const rows=SLOPE.map(x=>{const raw=p.slope[x.k];let s=null;
  if(x.sel){s=raw?+raw:null}else{const v=num(raw);s=v==null?null:x.f(v)}
  if(s!=null){t+=s;n++}return {x,s}});
 let g=null;if(n===5)g=t<=7?'不理想':t<=10?'尚可':t<=16.7?'次理想':'最理想';
 return {rows,t,n,g};
}

}/* 樁號推估：案件doc有 stakes:[{label,st,note,lat,lng}] 時，把GPS投影到設計中心線（同現場紀錄App） */
function fmtSt(st){const k=Math.floor(st/1000),m=st-k*1000;return `${k}K+${String(Math.round(m)).padStart(3,"0")}`}
function nearestStation(lat,lng){
 const c=cases.find(x=>x.id===curCase);const s=c&&c.stakes;if(!Array.isArray(s)||s.length<2||lat==null)return null;
 const lat0=s[0].lat,kx=Math.cos(lat0*Math.PI/180)*111320,ky=110540;
 const P=p=>[(p.lng-s[0].lng)*kx,(p.lat-lat0)*ky];const q=P({lat,lng});let best=null;
 for(let i=0;i<s.length-1;i++){const a=P(s[i]),b=P(s[i+1]),dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
  let t=((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
  const d=Math.hypot(q[0]-(a[0]+t*dx),q[1]-(a[1]+t*dy));
  if(!best||d<best.off)best={st:s[i].st+t*(s[i+1].st-s[i].st),off:d}}

}

/* EXIF（JPEG）拍攝時間與GPS：同現場紀錄App */
async function readExif(file){
 try{const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};let off=2;
  while(off+4<v.byteLength){const mk=v.getUint16(off);if((mk&0xFF00)!==0xFF00)break;const len=v.getUint16(off+2);
   if(mk===0xFFE1&&v.getUint32(off+4)===0x45786966)return parseTiff(v,off+10);off+=2+len;}
 }catch(e){}return {};
}
function parseTiff(v,t){
 const le=v.getUint16(t)===0x4949;const u16=o=>v.getUint16(t+o,le),u32=o=>v.getUint32(t+o,le);
 const ifd=o=>{const n=u16(o),tags={};for(let i=0;i<n;i++){const e=o+2+i*12;tags[u16(e)]={count:u32(e+4),vo:e+8}}return tags};
 const rat=tag=>{const o=u32(tag.vo),out=[];for(let i=0;i<tag.count;i++){const a=u32(o+i*8),b=u32(o+i*8+4);out.push(b?a/b:0)}return out};
 const asc=tag=>{const o=tag.count>4?u32(tag.vo):tag.vo;let s="";for(let i=0;i<tag.count;i++){const c=v.getUint8(t+o+i);if(!c)break;s+=String.fromCharCode(c)}return s};
 const out={};
 try{const i0=ifd(u32(4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const d=ex[0x9003]||ex[0x9004];if(d)out.taken=asc(d)}
  if(!out.taken&&i0[0x0132])out.taken=asc(i0[0x0132]);
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].vo));
   if(g[2]&&g[4]){const dms=a=>a[0]+a[1]/60+a[2]/3600;let lat=dms(rat(g[2])),lng=dms(rat(g[4]));
    if(g[1]&&asc(g[1])==="S")lat=-lat;if(g[3]&&asc(g[3])==="W")lng=-lng;
    if(lat||lng){out.lat=+lat.toFixed(6);out.lng=+lng.toFixed(6)}}}
 }catch(e){}return out;
}
function fmtExifTime(s){const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(s||"");return m?`${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`:""}
async function compress(file){
 let src;try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
 catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
 const w=src.width,h=src.height,s=Math.min(1,1920/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
 c.getContext("2d").drawImage(src,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

  const ex=await readExif(files[i]);

  // 不用檔案修改時間判斷（下載後再選回來的照片會誤用現在位置），改看照片內的拍攝時間

 <li>「匯出」可選設計階段（只列施工前，欄名標「設計階段」）或施工階段（施工前／施工中／完工三期），整理坡地、野溪兩張表，可複製成Word表格；並自動產生前言草稿（評估位置、乾涸項目、分數升降項目），＿＿＿處補原因即可。</li>
 <li>資料依案件存在雲端，手機、電腦開同一連結都看得到。</li></ol></div>
 <div class="card"><h3><span>特殊判定</span></h3><ul style="margin:0;padding-left:18px" class="mut">
 <li><b>橫向連結性</b>：先選海拔（800 m 上下用不同切點）。長度、坡度、落差三項都選才計分；長度、坡度、落差各分4級，級距＝長度級＋（坡度級與落差級取較差者）。原表列出的組合結果一致，原表沒列的搭配為依此規則推斷。</li>
 <li><b>溪床寬度變化</b>：原溪床≥10 m 的級距原表印刷矛盾，為依4級結構推斷。</li>
 <li><b>湍瀨出現頻率</b>：未見湍瀨直接判差；<b>縱向連結性</b>：無橫向構造物直接判佳，落差≥200 cm 為0分。</li></ul></div>
 <div class="card"><h3><span>級距分數</span></h3><div class="mut">20分項：佳16~20、良好11~15、普通6~10、差1~5（建議值18/13/8/3）。<br>10分項（左右岸各算）：佳9~10、良好6~8、普通3~5、差1~2（建議值9/7/4/2）。<br>坡地5因子各1~4分，總分≤7不理想、7~10尚可、10~16.7次理想、&gt;16.7最理想。</div></div>
 <div class="card"><h3><span>來源</span></h3><div class="mut">坡地棲地評估指標操作方法、野溪治理工程生態回復追蹤評估指標。級距若與最新官方版本不同，以官方為準。</div></div>`;
}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.p!=null){S.cur=+t.dataset.p;if(S.view==='cmp'||S.view==='note')S.view='creek';render();}
 else if(t.dataset.v){S.view=t.dataset.v;render();}
 else if(t.id==='expLink'){e.preventDefault();openExpSheet()}
 else if(t.id==='expClose'||t.id==='expSheet'){expSheet.hidden=true}
 else if(t.dataset.sexp){S.exp=t.dataset.sexp;lsSet('habitat_exp',S.exp);renderExpSheet();if(S.view==='cmp')render()}
 else if(t.dataset.xw){habDocx(t)}
 else if(t.dataset.xc){habCsv()}
 else if(t.dataset.xcmp){e.preventDefault();expSheet.hidden=true;S.view='cmp';render();scrollTo(0,0)}
 else if(t.dataset.exp){S.exp=t.dataset.exp;lsSet('habitat_exp',S.exp);render()}
 else if(t.dataset.copy){const D=exportData(),k=t.dataset.copy;
  if(k==='sT')copyRich(tblHtml(D.slope,true),tblTsv(D.slope),t);
  else if(k==='cT')copyRich(tblHtml(D.creek,true),tblTsv(D.creek),t);
  else cp($(k==='sD'?'dS':'dC').value,t)}
 else if(t.id==='caseAdd'){const r=$('caseAddRow');r.hidden=!r.hidden;if(!r.hidden)$('caseName').focus()}
 else if(t.id==='caseSave'){addCase()}
 else if(t.id==='caseDel'){delCase(t)}
 else if(t.dataset.recpick){recPick(t.dataset.recpick)}
 else if(t.dataset.phdel!=null){
  if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='確認刪除';setTimeout(()=>{t.dataset.armed='';t.textContent='刪除'},5000);return}
  const p=S.p[S.cur],x=phList(p,t.dataset.kind).splice(+t.dataset.phdel,1)[0];render();
  if(x&&assets)assets.delete(x.id).catch(()=>{});
 }
 else if(t.dataset.mv!=null){const p=S.p[S.cur],x=p.photos.splice(+t.dataset.mv,1)[0];if(x)phList(p,t.dataset.to).push(x);if(!p.photos.length)delete p.photos;render()}});
async function addCase(){
 const name=$('caseName').value.trim();if(!name||!db)return;
 try{await flush();const ref=db.collection('cases').doc();const p=[blank('施工前'),blank('施工中'),blank('完工')];
  await ref.set({name,createdAt:Date.now(),p});
  curCase=ref.id;S.cur=0;S.view='creek';loadCase(true);$('caseName').value='';$('caseAddRow').hidden=true;render();
 }catch(e){msg('案件建立失敗（'+(e.code||e.message)+'）')}
}
async function delCase(b){
 const c=cases.find(x=>x.id===curCase);if(!c||!db)return;
 if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='確認刪除';msg(`「${c.name}」的三期評分會一起刪掉，無法復原。確定請再按「確認刪除」。`);
  delArm=setTimeout(()=>{b.dataset.armed='';b.textContent='刪除';msg('')},6000);return}
 clearTimeout(delArm);b.dataset.armed='';b.textContent='刪除';msg('');
 clearTimeout(saveTimer);saveTimer=null;saveFn=null;
 try{await db.doc('cases/'+c.id).delete();curCase='';
  if(assets)for(const q of (c.p||[]))for(const x of [...(q.photos||[]),...(q.photosCreek||[]),...(q.photosSlope||[])]){try{await assets.delete(x.id)}catch(e){}}
 }catch(e){msg('刪除失敗（'+(e.code||e.message)+'）')}
}
function cp(txt,btn){const done=()=>{const o=btn.textContent;btn.textContent='已複製';setTimeout(()=>btn.textContent=o,1200)};
 try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done))}catch(_){fallback(txt,done)}}
function fallback(txt,done){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(_){}a.remove()}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='caseSel'){msg('');(async()=>{await flush();curCase=t.value;S.cur=0;loadCase(true);render()})();return}
 if(!S.p)return;
 const p=S.p[S.cur];
 if(t.dataset.c||t.dataset.o||t.dataset.sl||t.dataset.f||t.dataset.gps!=null)addBy(p);
 if(t.dataset.ph){const fs=[...t.files];t.value='';if(fs.length)upPhotos(fs,t.dataset.ph,!!t.dataset.cam);return}
 if(t.dataset.gps!=null){const m=t.value.match(/(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)/);
  if(!m){t.style.borderColor='var(--bad)';return}
  const x=phList(p,t.dataset.kind)[+t.dataset.gps];x.lat=+(+m[1]).toFixed(6);x.lng=+(+m[2]).toFixed(6);x.gps='manual';render();return}
 if(t.dataset.hi){const h=t.value==='1';S.p.forEach(q=>{q.high=h;Object.keys(q.creek).forEach(k=>{if(k.startsWith('lat'))q.creek[k].ovr=null})});render();return;}
 if(t.dataset.f){const f=t.dataset.f;p[f]=t.type==='checkbox'?t.checked:t.value;render();return;}
 if((t.dataset.c||t.dataset.o||t.dataset.sl)&&isBlankP(p))p.date=todayStr(); // 第一筆評分：存入當天日期
 if(t.dataset.c){const k=t.dataset.c;const st=p.creek[k]=p.creek[k]||{};st[t.dataset.k]=t.value;st.ovr=null;
  if(k==='wchg'&&t.dataset.k==='t')delete st.v;
  if((k.startsWith('riffle')||k.startsWith('long'))&&t.dataset.k==='v')delete st.t;
  render();return;}
 if(t.dataset.o){const k=t.dataset.o;const st=p.creek[k]=p.creek[k]||{};
  const mn=+t.dataset.min,mx=+t.dataset.max;let v=Math.round(+t.value);if(isNaN(v))v=mn;v=Math.min(mx,Math.max(mn,v));
  const it=ITEMS.find(x=>k.startsWith(x.id)&&(k===x.id||k===x.id+'L'||k===x.id+'R'));
  const sd=k.slice(it.id.length);const r=evalItem(it,sd,p);st.ovr=v;st.ovrBand=r.b;render();return;}
 if(t.dataset.sl){p.slope[t.dataset.sl]=t.value;render();return;}
});
/* 案件挑選器：全螢幕清單＋搜尋，最近用過的在前（底層仍是原本的select；與現場紀錄相同） */
function makePicker(sel,recentKey){
 if(matchMedia('(pointer:fine)').matches)return; // 電腦（滑鼠）維持原本的下拉選單
 const btn=document.createElement('button');btn.type='button';btn.className='act pickbtn';sel.before(btn);sel.hidden=true;
 const sync=()=>{const o=sel.options[sel.selectedIndex];btn.textContent=o?o.textContent:'（尚無案件）'};
 new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true});
 const recent=()=>{try{return JSON.parse(lsGet(recentKey)||'[]')}catch(e){return []}};
 const touch=v=>{if(!v)return;lsSet(recentKey,JSON.stringify([v,...recent().filter(x=>x!==v)].slice(0,30)))};
 sel.addEventListener('change',()=>{touch(sel.value);sync()});
 setInterval(()=>{if(btn.dataset.v!==sel.value){btn.dataset.v=sel.value;sync()}},500);
 btn.onclick=()=>{
  const opts=[...sel.options].filter(o=>o.value),rec=recent(),rank=v=>{const i=rec.indexOf(v);return i<0?1e9:i};
  const ov=document.createElement('div');ov.className='picker';
  ov.innerHTML='<div class="pkh"><input type="text" placeholder="搜尋案件名稱" aria-label="搜尋案件"><button type="button" class="act">取消</button></div><ul></ul>';
  const q=ov.querySelector('input'),ul=ov.querySelector('ul');
  const close=()=>{ov.remove();document.body.style.overflow=''};
  ov.querySelector('button').onclick=close;
  const draw=()=>{
   const k=q.value.trim().toLowerCase();ul.innerHTML='';
   const hit=opts.filter(o=>!k||o.textContent.toLowerCase().includes(k));
   const r=hit.filter(o=>rank(o.value)<1e9).sort((a,b)=>rank(a.value)-rank(b.value)),rest=hit.filter(o=>rank(o.value)>=1e9);
   const grp=(t,l)=>{if(!l.length)return;if(!k&&r.length&&rest.length){const h=document.createElement('li');h.className='grp';h.textContent=t;ul.appendChild(h)}
    l.forEach(o=>{const li=document.createElement('li');li.textContent=o.textContent;if(o.value===sel.value)li.className='on';
     li.onclick=()=>{close();if(sel.value!==o.value){sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}))}};ul.appendChild(li)})};
   grp('最近使用',r);grp('其他案件',rest);
   if(!hit.length){const li=document.createElement('li');li.className='grp';li.textContent='找不到符合的案件';ul.appendChild(li)}
  };
  q.oninput=draw;draw();document.body.appendChild(ov);document.body.style.overflow='hidden';
 };
 sync();
}
makePicker($('caseSel'),'eco-recent-habitat');
whoShow();$('whoIn').oninput=e=>lsSet('eco-recorder',e.target.value);
$('shareBtn').onclick=e=>{e.preventDefault();share()};
render();
initDb();
