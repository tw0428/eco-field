<title>棲地評估算分</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<script>
// 程式出錯時直接顯示在右上角狀態（避免只看到「連線中…」）
window.addEventListener("error",e=>{const c=document.getElementById("conn");if(c)c.textContent="程式錯誤："+(e.message||"未知")+(e.lineno?"（第"+e.lineno+"行）":"")});

// LINE內建瀏覽器跟Safari分開存金鑰與定位權限 → 自動改用外部瀏覽器開（LINE支援 openExternalBrowser=1）
if(/\bLine\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search)){const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');location.replace(u.href)}
// 同事分享連結 #k=金鑰：存進這支手機後從網址拿掉（#後面的內容不會送到任何伺服器）
else{const m=location.hash.match(/[#&]k=([^&]+)/);if(m){try{localStorage.setItem('gh-token',decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}}
// 網頁存手機（sw.js）：有新版時顯示提示條，點了才換新版
if('serviceWorker' in navigator&&location.protocol==='https:'){
 navigator.serviceWorker.onmessage=e=>{if(!e.data||e.data.type!=='update'||document.getElementById('updBar'))return;
  const b=document.createElement('button');b.id='updBar';b.type='button';b.textContent='有新版本，點這裡更新';
  b.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:14px;border-radius:10px;border:0;background:#2f6b4f;color:#fff;font:inherit;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)';
  b.onclick=()=>{flush().finally(()=>location.reload())};document.body.appendChild(b)};
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// ↻ 時順便檢查工具本身：網路上的版本（內嵌程式與樣式）和現在跑的不同，就換進手機副本並重新載入
const appSig=d=>[...d.querySelectorAll('script:not([src]),style')].map(e=>e.textContent).join('\n');
let appSigNow=null;document.addEventListener('DOMContentLoaded',()=>{appSigNow=appSig(document)});
async function appUpd(){
 try{const p=location.pathname.split('/').pop()||'index.html';
  const r=await fetch(p+'?swbypass='+Date.now(),{cache:'no-store'});if(!r.ok||appSigNow==null)return false;
  const t=await r.text();if(appSig(new DOMParser().parseFromString(t,'text/html'))===appSigNow)return false;
  const c=await caches.open('eco-pages-v2'); // 與 sw.js 的 CACHE 同名
  await c.put(p,new Response(t,{headers:{'Content-Type':'text/html; charset=utf-8'}}));return true
 }catch(e){return false}
}
</script>
<style>

<script>
'use strict';
/* ===== 資料定義 ===== */
const BAND=['佳','良好','普通','差'];

const hb=(v,c)=>v>=c[0]?0:v>=c[1]?1:v>=c[2]?2:3;                 // 越高越好：下限含
const lb=(v,c,inc)=>{const t=inc?((a,b)=>a<=b):((a,b)=>a<b);return t(v,c[0])?0:t(v,c[1])?1:t(v,c[2])?2:3;}; // 越低越好：上限不含
const num=x=>(x===''||x==null||isNaN(+x))?null:+x;

const ADJ={
sub:{p:['粒徑≥3公尺巨石，或以大小漂石、圓石為主','生物可棲息空隙多','多倒木、漂流木、枯枝落葉與有機碎屑','完工後重新鋪石、拋石、棲地營造','基質上生長矽藻、苔蘚，或發現清潔水生昆蟲、蝦蟹魚類'],m:['底質主要為細顆粒（礫石、砂土、黏土）','溪床整平、漿砌、封底','移除大小漂石與>3公尺巨石','無生物利用']},
embed:{p:['溪水充沛，預計可快速帶走臨時沉積土砂','設沉砂池、施工遠離流水區、土包袋過濾'],m:['溪水濁度高','深潭易嚴重淤積土砂']},
flow:{p:['存在湍瀨或深潭','有粒徑≥3公尺大石巨石','瀨潭連續交錯','發現好高溶氧水生生物利用','完工後重新鋪石、拋石、棲地營造'],m:['缺乏連續湍瀨、深潭或岸邊緩流','形成漫流']},
riffle:{p:['目視可見連續湍瀨，或有>3公尺巨石、漂石、礫石或樹幹激起湍瀨（加1~2分）'],m:['目視無連續湍瀨且無巨石等天然物','溪流渠道化']},
depth:{p:['發現魚蝦蟹類利用','有水窪或深潭等避難所','水面覆蓋溪床比例超過75%'],m:['溪床整平、渠道化或混凝土封底，導致淺緩或漫流','上游有固定性引水設施（堰、混凝土設施）','與附近自然參考點比較水量明顯減少']},
bank:{p:['濱溪植被帶具完整多層次原生植被（喬、灌、草）','植被茂密鬱閉、幾無人為破壞','雖有破壞擾動但逐漸演替恢復','林相：天然林>人工林>竹林、果園>草生地>道路建物'],m:['僅灌叢與草本、缺乏喬木','明顯人為擾動（整地、砍伐、除草）','大樹因治理工程移除','外來入侵種拓殖']},
bw:{p:['多層次原生植被','茂密鬱閉、幾無人為破壞','濱溪植物帶與兩岸森林完整連接','雖有破壞但逐漸恢復','嚴格控制回填區裸露面小於3公尺'],m:['僅灌叢與草本','明顯人為擾動','大樹因治理工程移除','外來入侵種拓殖']},
wchg:{p:['全段或部分自然溪段、濱溪植被被保留','經復育後坡岸植被向溪流生長、裸露面寬度降低','設置低水流路或深槽區，提供灘地復育植生空間'],m:['溪床整平、壓實、混凝土封底','移除坡岸植被']},
long:{p:['橫向構造物材質具孔隙度與粗糙度','橫向構造物坡度低於45度','有改善縱向連結性之設計（如各型魚道）'],m:['視當地目標魚種上溯能力與構造物落差']},
lat:{p:['護岸每40公尺設置動物通道','動物通道連結自然棲地','濱溪植被帶恢復、阻隔降低','邊坡粗糙度高或為自然坡面'],m:[]}
};

/* 選項值＝落在該級距內的代表值，計算邏輯不變；舊資料/匯入的原始數值仍可用 */
const F=(k,label,opts)=>({k,label,opts});
const ITEMS=[
 {id:'sub',no:1,name:'溪床自然基質多樣性',max:20,fields:[F('v','理想基質占河道面積',[[80,'≥70%（佳）'],[55,'40~70%（良好）'],[30,'20~40%（普通）'],[10,'<20%（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:hb(v,[70,40,20])}}},
 {id:'embed',no:2,name:'河床底質包埋度',max:20,fields:[F('v','石礫被砂土包圍的體積',[[10,'<25%（佳）'],[35,'25~50%（良好）'],[60,'50~75%（普通）'],[90,'≥75%（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:lb(v,[25,50,75])}}},
 {id:'flow',no:3,name:'流速水深組合',max:20,dry:true,fields:[F('v','水型種數（淺瀨/淺流/深流/深潭/岸邊緩流）',[[5,'5種（佳）'],[4,'4種（佳）'],[3,'3種（良好）'],[2,'2種（普通）'],[1,'1種（差）'],[0,'0種（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:v>=4?0:v==3?1:v==2?2:3}}},
 {id:'riffle',no:4,name:'湍瀨出現頻率',max:20,dry:true,fields:[F('v','湍瀨間距÷河寬',[[3,'<7倍（佳）'],[10,'7~16倍（良好）'],[20,'16~25倍（普通）'],[30,'≥25倍（差）'],['none','未見湍瀨（差，免量測）']])],calc:s=>{if(s.t==='none'||s.v==='none')return {b:3,note:'未見湍瀨且無巨石激流，依原表判為「差」；可依扣分原則在1~5分內酌降'};const v=num(s.v);return v==null?null:{b:lb(v,[7,16,25])}}},
 {id:'depth',no:5,name:'河道水流狀態',max:20,dry:true,fields:[F('v','有效水深',[[40,'≥30 cm（佳）'],[20,'15~30 cm（良好）'],[10,'5~15 cm（普通）'],[2,'<5 cm（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:hb(v,[30,15,5])}}},
 {id:'bank',no:6,name:'堤岸的植生保護',max:10,sides:true,fields:[F('v','植生覆蓋堤岸長度',[[95,'≥90%（佳）'],[80,'70~90%（良好）'],[60,'50~70%（普通）'],[30,'<50%（差）']])],calc:s=>{const v=num(s.v);return v==null?null:{b:hb(v,[90,70,50])}}},

function lateral(s,high){
 const L=num(s.L),sl=num(s.sl),d=num(s.d);
 if(L==null&&sl==null&&d==null)return null;
 if(L==null||sl==null||d==null){
  const lv=L==null?0:(!high?(L>=30?0:L>=21?1:L>=11?2:3):(L>=20?0:L>=11?1:L>=6?2:3));
  const s0=sl==null?0:(!high?(sl<=30?0:sl<=40?1:sl<=60?2:3):(sl<=40?0:sl<=50?1:sl<=60?2:3));
  const d0=d==null?0:(d<=5?0:d<=10?1:d<=20?2:3);
  const best=Math.min(3,lv+Math.max(s0,d0));
  const miss=[L==null?'長度':'',sl==null?'坡度':'',d==null?'落差':''].filter(Boolean).join('、');
  return {pending:true,note:`尚缺${miss}（原表需三項同時判定）。依已選項目，最好只能到「${BAND[best]}」，不計入總分`};
 }
 // 表10/11：長度、坡度、落差各分0~3級；原表組合＝長度級＋坡度落差級（坡度與落差同級）
 // 坡度與落差不同級時取較差者（原表：優先考量坡度與最大落差），故級距＝長度級＋max(坡度級,落差級)
 let Lv,sv;
 if(!high){Lv=L>=30?0:L>=21?1:L>=11?2:3;sv=sl<=30?0:sl<=40?1:sl<=60?2:3;}
 else{Lv=L>=20?0:L>=11?1:L>=6?2:3;sv=sl<=40?0:sl<=50?1:sl<=60?2:3;}
 const dv=d<=5?0:d<=10?1:d<=20?2:3;
 const b=Math.min(3,Lv+Math.max(sv,dv));
 const why=Lv===3?'可通行長度不足':sv===3?'坡度>60°':dv===3?'落差>20 cm':'';
 return {b,note:(sv!==dv?'坡度與落差不同級，取較差者計。':'')+(why?why+'，判為差。':'')};
}

/* ===== 計算 ===== */
function evalItem(it,side,p){
 const key=it.id+(side||'');const st=p.creek[key]||{};
 const ctx={high:p.high};
 let r=it.calc(st,ctx);
 if(it.dry&&st.v==='dry')r={zero:true,note:'乾涸／斷流／伏流，0分'};
 if(!r||r.pending)return {key,st,empty:true,max:it.max,hint:r&&r.note};
 if(r.zero)return {key,st,zero:true,score:0,note:r.note,max:it.max};
 const rng=(it.max===20?R20:R10)[r.b],sug=(it.max===20?S20:S10)[r.b];
 let sc=st.ovr!=null&&st.ovrBand===r.b?Math.min(rng[1],Math.max(rng[0],st.ovr)):sug;
 return {key,st,b:r.b,rng,sug,score:sc,note:r.note,max:it.max};
}
function creekAll(p){

}

const SLOPE=[
 {k:'w',name:'木本植物覆蓋度',opts:[[0,'0%（1分）'],[10,'<15%（2分）'],[30,'15~55%（3分）'],[70,'≥55%（4分）']],f:v=>v===0?1:v<15?2:v<55?3:4},
 {k:'sp',name:'植生種數',opts:[[10,'<15種/100m²（1分）'],[17,'15~20種（2分）'],[25,'20~30種（3分）'],[35,'≥30種（4分）']],f:v=>v<15?1:v<20?2:v<30?3:4},
 {k:'nat',name:'原生種覆蓋度',opts:[[5,'<10%（1分）'],[20,'10~30%（2分）'],[50,'30~65%（3分）'],[80,'≥65%（4分）']],f:v=>v<10?1:v<30?2:v<65?3:4},
 {k:'ly',name:'植物社會層次',sel:[[1,'一層或裸露'],[2,'二層'],[3,'三層'],[4,'四層以上']]},
 {k:'su',name:'演替階段',sel:[[1,'裸露或外來種優勢（拓殖期）'],[2,'初期草本優勢（初期）'],[3,'先驅樹種優勢（中期）'],[4,'中後期物種優勢（後期）']]}

function slopeEval(p){

  if(x.sel){s=raw?+raw:null}else{const v=num(raw);s=v==null?null:x.f(v)}

/* EXIF（JPEG）拍攝時間與GPS：同現場紀錄App */
async function readExif(file){
 try{const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};let off=2;
  while(off+4<v.byteLength){const mk=v.getUint16(off);if((mk&0xFF00)!==0xFF00)break;const len=v.getUint16(off+2);
   if(mk===0xFFE1&&v.getUint32(off+4)===0x45786966)return parseTiff(v,off+10);off+=2+len;}
 }catch(e){}return {};
}
function parseTiff(v,t){
 const le=v.getUint16(t)===0x4949;const u16=o=>v.getUint16(t+o,le),u32=o=>v.getUint32(t+o,le);
 const ifd=o=>{const n=u16(o),tags={};for(let i=0;i<n;i++){const e=o+2+i*12;tags[u16(e)]={count:u32(e+4),vo:e+8}}return tags};
 const rat=tag=>{const o=u32(tag.vo),out=[];for(let i=0;i<tag.count;i++){const a=u32(o+i*8),b=u32(o+i*8+4);out.push(b?a/b:0)}return out};
 const asc=tag=>{const o=tag.count>4?u32(tag.vo):tag.vo;let s="";for(let i=0;i<tag.count;i++){const c=v.getUint8(t+o+i);if(!c)break;s+=String.fromCharCode(c)}return s};
 const out={};
 try{const i0=ifd(u32(4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const d=ex[0x9003]||ex[0x9004];if(d)out.taken=asc(d)}
  if(!out.taken&&i0[0x0132])out.taken=asc(i0[0x0132]);
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].vo));
   if(g[2]&&g[4]){const dms=a=>a[0]+a[1]/60+a[2]/3600;let lat=dms(rat(g[2])),lng=dms(rat(g[4]));
    if(g[1]&&asc(g[1])==="S")lat=-lat;if(g[3]&&asc(g[3])==="W")lng=-lng;
    if(lat||lng){out.lat=+lat.toFixed(6);out.lng=+lng.toFixed(6)}}}
 }catch(e){}return out;
}
function fmtExifTime(s){const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(s||"");return m?`${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`:""}
async function compress(file){

 catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}

 const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);

   地區、階段只用案件上明確設定的值（現場紀錄案件資訊區、本次階段），沒設定的歸「未設定」，不從案名推測
   長案名：保留開頭與最後10字、中間省略，工區編號才看得到 */
const PICK_STAGES=["提報","設計","開工前","施工中","完工"];
function nameEl(el,t){el.textContent="";
  // 選項文字＝案名＋（紀錄數）：紀錄數不顯示；案名結尾的括號（工區一）固定顯示，前面太長才省略
  const m=/^(.*?)(（\d+）)?$/.exec(t),nm=m[1],cnt=m[2]||"",tl=/（[^（）]+）$/.exec(nm);
  const h=document.createElement("span");h.className="nh";h.textContent=tl?nm.slice(0,tl.index):nm;el.appendChild(h);
  if(tl){const s=document.createElement("span");s.className="nt";s.textContent=tl[0];el.appendChild(s)}}
// 頂端按鈕：案名完整顯示（最多兩行），不放紀錄數
const btnName=(btn,t)=>{btn.textContent=t.replace(/（\d+）$/,"")};
// 複數工區：同一案的工區在清單合併成一列，選進去後案名下方切換工區；資料仍各工區一份
// 同案判斷：案件有 group（匯入時標）就用它，否則看案名結尾「（工區X）」
const ZRE=/^(.*?)\s*[（(]\s*(工區[^）)]*)\s*[）)]\s*$/,ZNUM="一二三四五六七八九十";
function zoneInfo(c){if(!c)return null;if(c.group)return {base:c.group,zone:c.zone||c.name};const m=ZRE.exec(c.name||"");return m?{base:m[1].trim(),zone:m[2]}:null}
const zoneNo=z=>{const m=/工區\s*([一二三四五六七八九十]|\d+)/.exec(z||"");return m?(/\d/.test(m[1])?+m[1]:ZNUM.indexOf(m[1])+1):99};
function zoneMates(id){const c=cases.find(x=>x.id===id),z=zoneInfo(c);if(!z)return c&&!c.trashedAt?[c]:[];
  return cases.filter(x=>!x.trashedAt&&(zoneInfo(x)||{}).base===z.base).sort((a,b)=>zoneNo(zoneInfo(a).zone)-zoneNo(zoneInfo(b).zone)||(a.name||"").localeCompare(b.name||"","zh-Hant"))}
// ops：add(name)建立並切到新案件、trash(id)移到垃圾桶、restore(id)復原、trashed()垃圾桶清單[{id,name}]
// 手機全螢幕、電腦置中面板；第一列「＋新增案件」，每列右邊📌釘選＋紅色垃圾桶（按兩次才移除），垃圾桶在最下面可復原
const TRASH_SVG='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
function makePicker(sel,recentKey,metaOf,ops){
  ops=ops||{};
  const btn=document.createElement("button");btn.type="button";btn.className="pickbtn grow act";sel.before(btn);sel.hidden=true;
  const zbar=document.createElement("div");zbar.className="zonebar";zbar.hidden=true;btn.parentElement.after(zbar);
  const pick=v=>{if(sel.value!==v){sel.value=v;sel.dispatchEvent(new Event("change",{bubbles:true}))}};
  const sync=()=>{const o=sel.options[sel.selectedIndex],m=o&&o.value?metaOf(o.value):{};
    btnName(btn,o&&o.value?(m.group||o.textContent):"（尚無案件，點這裡新增）");
    const zs=o&&o.value&&m.group?zoneMates(o.value):[];zbar.innerHTML="";zbar.hidden=zs.length<2;
    if(zs.length>1)zs.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=zoneInfo(c).zone;
      b.setAttribute("aria-pressed",String(c.id===sel.value));b.onclick=()=>pick(c.id);zbar.appendChild(b)})};
  new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true});
  const recent=()=>{try{return JSON.parse(lsGet(recentKey)||"[]")}catch(e){return []}};
  const touch=v=>{if(!v)return;lsSet(recentKey,JSON.stringify([v,...recent().filter(x=>x!==v)].slice(0,30)))};
  const pins=()=>{try{return JSON.parse(lsGet("eco-pins")||"[]")}catch(e){return []}};
  const pinHit=v=>{const nm=metaOf(v).name;return x=>x.id===v||(nm&&x.name===nm)};
  const isPin=e=>e.ids.some(v=>pins().some(pinHit(v)));
  const togglePin=e=>{let l=pins();if(isPin(e))e.ids.forEach(v=>{l=l.filter(x=>!pinHit(v)(x))});else l=[...l,{id:e.rep.value,name:metaOf(e.rep.value).name}];lsSet("eco-pins",JSON.stringify(l))};
  sel.addEventListener("change",()=>{touch(sel.value);sync()});
  setInterval(()=>{if(btn.dataset.v!==sel.value){btn.dataset.v=sel.value;sync()}},500); // 程式改value不會觸發事件
  btn.onclick=()=>{
    const rec=recent(),rank=v=>{const i=rec.indexOf(v);return i<0?1e9:i};
    const ov=document.createElement("div");ov.className="picker";
    ov.innerHTML='<div class="pkh"><input type="text" placeholder="搜尋案件名稱" aria-label="搜尋案件"><button type="button" class="act">取消</button></div><div class="pkmode"><span>分組</span><div class="seg"></div></div><ul></ul>';
    const q=ov.querySelector("input"),ul=ov.querySelector("ul"),seg=ov.querySelector(".seg");
    let addOpen=false,addVal="",trOpen=false,armed=null,armT=null;
    const onKey=e=>{if(e.key==="Escape")close()};
    const close=()=>{clearTimeout(armT);ov.remove();document.body.style.overflow="";document.removeEventListener("keydown",onKey)};
    ov.querySelector(".pkh button").onclick=close;document.addEventListener("keydown",onKey);
    const draw=()=>{
      // 同案的工區併成一列（rep＝最近用過的那個工區，點了切到它）
      const ents=[],byG={};
      [...sel.options].filter(o=>o.value).forEach(o=>{const g=metaOf(o.value).group;
        if(g&&byG[g]){byG[g].opts.push(o);return}const e={key:g||o.value,label:g||o.textContent,opts:[o]};if(g)byG[g]=e;ents.push(e)});
      ents.forEach(e=>{e.ids=e.opts.map(o=>o.value);e.rep=e.opts.find(o=>o.value===sel.value)||[...e.opts].sort((a,b)=>rank(a.value)-rank(b.value))[0];e.value=e.rep.value;
        e.text=e.opts.map(o=>o.textContent).join(" ").toLowerCase()});
      let mode=lsGet("eco-pickmode")||"recent";if(mode==="stage")mode="recent"; /* 階段分組拿掉：依上次開啟判斷不準 */
      seg.innerHTML="";[["recent","最近使用"],["area","地區"],["plan","計畫編號"]].forEach(([m,t])=>{const b=document.createElement("button");b.type="button";b.textContent=t;
        b.className=m===mode?"on":"";b.setAttribute("aria-pressed",String(m===mode));b.onclick=()=>{lsSet("eco-pickmode",m);draw()};seg.appendChild(b)});
      const k=q.value.trim().toLowerCase();ul.innerHTML="";
      const er=e=>Math.min(...e.ids.map(rank));
      const hit=ents.filter(e=>!k||e.text.includes(k)),byRank=(a,b)=>er(a)-er(b)||a.label.localeCompare(b.label,"zh-Hant");
      const head=t=>{const h=document.createElement("li");h.className="grp";h.textContent=t;ul.appendChild(h)};
      // 第一列：新增案件（點了變成輸入框）
      if(ops.add&&!k){const li=document.createElement("li");li.className="pkadd";
        if(!addOpen){li.textContent="＋ 新增案件";li.onclick=()=>{addOpen=true;draw()}}
        else{const inp=document.createElement("input");inp.type="text";inp.placeholder="輸入案件名稱";inp.value=addVal;inp.oninput=()=>{addVal=inp.value};
          const ok=document.createElement("button");ok.type="button";ok.className="primary";ok.textContent="建立";
          const cc=document.createElement("button");cc.type="button";cc.textContent="取消";cc.onclick=()=>{addOpen=false;addVal="";draw()};
          const go=async()=>{const n=inp.value.trim();if(!n){inp.focus();return}ok.disabled=true;ok.textContent="建立中…";
            try{await ops.add(n);close()}catch(e){ok.disabled=false;ok.textContent="失敗，再按一次"}};
          ok.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};li.append(inp,ok,cc);setTimeout(()=>inp.focus(),0)}
        ul.appendChild(li)}
      const item=e=>{const li=document.createElement("li");if(e.ids.includes(sel.value))li.className="on";
        const nm=document.createElement("span");nm.className="pkname";nameEl(nm,e.label);
        if(e.opts.length>1){const z=document.createElement("span");z.className="nc";z.textContent=`${e.opts.length}個工區`;nm.appendChild(z)}
        const pb=document.createElement("button");pb.type="button";pb.className="pin";const on=isPin(e);pb.append(ic(on?"starf":"star"));pb.setAttribute("aria-label",on?"取消釘選":"釘選");
        pb.onclick=ev=>{ev.stopPropagation();togglePin(e);draw()};
        li.append(nm,pb);
        if(ops.trash){const tb=document.createElement("button");tb.type="button";tb.className="pin trash";const arm=armed===e.key;
          if(arm){tb.classList.add("armed");tb.textContent=e.opts.length>1?`${e.opts.length}個工區都移到垃圾桶？`:"移到垃圾桶？";li.classList.add("arming")}else tb.innerHTML=TRASH_SVG;
          tb.setAttribute("aria-label","移到垃圾桶");
          tb.onclick=async ev=>{ev.stopPropagation();clearTimeout(armT);
            if(!arm){armed=e.key;armT=setTimeout(()=>{armed=null;draw()},4000);draw();return}
            armed=null;tb.disabled=true;tb.textContent="移除中…";
            try{for(const v of e.ids)await ops.trash(v);draw()}catch(_){tb.textContent="失敗";setTimeout(draw,1500)}};
          li.appendChild(tb)}
        li.onclick=()=>{close();pick(e.value)};ul.appendChild(li)};
      const P=hit.filter(isPin).sort(byRank),R=hit.filter(e=>!isPin(e));
      if(P.length){head("釘選");P.forEach(item)}
      if(k){R.sort(byRank).forEach(item)}
      else if(mode==="recent"){const r=R.filter(e=>er(e)<1e9).sort(byRank),rest=R.filter(e=>er(e)>=1e9).sort(byRank);
        if(r.length){head("最近使用");r.forEach(item)}if(rest.length){head("其他案件");rest.forEach(item)}}
      else{const key=e=>metaOf(e.value)[mode]||"",keys=[...new Set(R.map(key))];
        keys.sort((a,b)=>!a?1:!b?-1:mode==="plan"?b.localeCompare(a):a.localeCompare(b,"zh-Hant"));
        keys.forEach(g=>{head(g||(mode==="area"?"未設定地區":"未設定計畫編號"));R.filter(e=>key(e)===g).sort(byRank).forEach(item)})}
      if(!hit.length&&k)head("找不到符合的案件");
      // 垃圾桶：移除的案件資料都還在，點「復原」放回清單
      const T=ops.trashed?ops.trashed().filter(c=>!k||(c.name||"").toLowerCase().includes(k)):[];
      if(T.length){const h=document.createElement("li");h.className="grp trashgrp";h.textContent=`${trOpen?"▾":"▸"} 垃圾桶（${T.length}）・可復原`;h.onclick=()=>{trOpen=!trOpen;draw()};ul.appendChild(h);
        if(trOpen)T.forEach(c=>{const li=document.createElement("li");li.className="trashed";const nm=document.createElement("span");nm.className="pkname";nameEl(nm,c.name||"");
          const rb=document.createElement("button");rb.type="button";rb.className="restore";rb.textContent="復原";
          rb.onclick=async ev=>{ev.stopPropagation();rb.disabled=true;rb.textContent="復原中…";try{await ops.restore(c.id);draw()}catch(_){rb.disabled=false;rb.textContent="失敗，再按一次"}};
          li.append(nm,rb);ul.appendChild(li)})}
    };
    q.oninput=draw;draw();document.body.appendChild(ov);document.body.style.overflow="hidden";
  };
  sync();
}
makePicker($('caseSel'),'eco-recent-habitat',habMeta,{
 add:async name=>{if(!db)throw new Error('未連線');await flush();const ref=db.collection('cases').doc();await ref.set({name,createdAt:Date.now(),p:[blank('施工前'),blank('施工中'),blank('完工')]});
  curCase=ref.id;S.cur=0;S.view='creek';loadCase(true);render()},
 trash:async id=>{await flush();await db.doc('cases/'+id).update({trashedAt:Date.now()});const c=cases.find(x=>x.id===id);if(c)c.trashedAt=Date.now();
  if(curCase===id){curCase=(cases.find(x=>!x.trashedAt)||{}).id||'';S.cur=0;loadCase(true)}render()},
 restore:async id=>{await db.doc('cases/'+id).update({trashedAt:null});const c=cases.find(x=>x.id===id);if(c)c.trashedAt=null;render()},
 trashed:()=>cases.filter(c=>c.trashedAt).sort((a,b)=>b.trashedAt-a.trashedAt)});
whoShow();$('whoIn').oninput=e=>lsSet('eco-recorder',e.target.value);
$('shareBtn').onclick=e=>{e.preventDefault();share()};
render();
initDb();
</script>
