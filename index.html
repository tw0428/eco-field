<title>生態現場紀錄</title>
<script>
// 程式出錯時直接顯示在右上角狀態（避免只看到「連線中…」）
window.addEventListener("error",e=>{const c=document.getElementById("conn");if(c)c.textContent="程式錯誤："+(e.message||"未知")+(e.lineno?"（第"+e.lineno+"行）":"")});

// LINE內建瀏覽器跟Safari分開存金鑰與定位權限 → 自動改用外部瀏覽器開（LINE支援 openExternalBrowser=1）
if(/\bLine\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search)){const u=new URL(location.href);u.searchParams.set("openExternalBrowser","1");location.replace(u.href)}
// 同事分享連結 #k=金鑰：存進這支手機後從網址拿掉（#後面的內容不會送到任何伺服器）
else{const m=location.hash.match(/[#&]k=([^&]+)/);if(m){try{localStorage.setItem("gh-token",decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,"",location.pathname+location.search)}}
// 網頁存手機（sw.js）：有新版時顯示提示條，點了才換新版（避免表單填一半被重新整理）
if("serviceWorker" in navigator&&location.protocol==="https:"){
  navigator.serviceWorker.onmessage=e=>{if(!e.data||e.data.type!=="update"||document.getElementById("updBar"))return;
    const b=document.createElement("button");b.id="updBar";b.type="button";b.textContent="有新版本，點這裡更新";
    b.style.cssText="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:14px;border-radius:10px;border:0;background:#2f6b4f;color:#fff;font:inherit;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)";
    b.onclick=()=>location.reload();document.body.appendChild(b)};
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
// ↻ 時順便檢查工具本身：網路上的版本（內嵌程式與樣式）和現在跑的不同，就換進手機副本並重新載入
const appSig=d=>[...d.querySelectorAll("script:not([src]),style")].map(e=>e.textContent).join("\n");
let appSigNow=null;document.addEventListener("DOMContentLoaded",()=>{appSigNow=appSig(document)});
async function appUpd(){
  try{const p=location.pathname.split("/").pop()||"index.html";
    const r=await fetch(p+"?swbypass="+Date.now(),{cache:"no-store"});if(!r.ok||appSigNow==null)return false;
    const t=await r.text();if(appSig(new DOMParser().parseFromString(t,"text/html"))===appSigNow)return false;
    const c=await caches.open("eco-pages-v2"); // 與 sw.js 的 CACHE 同名
    await c.put(p,new Response(t,{headers:{"Content-Type":"text/html; charset=utf-8"}}));return true
  }catch(e){return false}
}
</script>
<style>

<script>
// 照片類別對應各階段檢核表的照片欄：提報=表1現況照片1~9、設計=表2、開工前=表5、施工中=表9、完工=表10
const CATS_BY={"提報":["植被相","水域類型","水域底質","水域型態","其他"],"設計":["生態保護對象","棲地影像","其他"],"開工前":["生態保護對象","生態友善措施","其他"],"施工中":["生態保護對象","生態友善措施","棲地影像","異常狀況","改善","其他"],"完工":["生態保護對象","生態友善措施","棲地影像","其他"]};
const isFM=c=>/友善措施/.test(c||"");
function catList(){const l=[...(CATS_BY[curStage()]||CATS_BY["施工中"])];if(cat&&!l.includes(cat))l.unshift(cat);return l}
const ABCD=[["A","迴避"],["B","縮小"],["C","減輕"],["D","補償"]];
const $=id=>document.getElementById(id);
let db=null, assets=null, cases=[], records=[], curCase="", cat="", abcd="", pending=[], editing=null, editKeep=[], saving=false;

function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* 紀錄者（兩頁共用 eco-recorder）：標題下方欄位直接輸入，新紀錄帶 by */

// 分享連結＝這支手機目前的金鑰（網頁無法自己產生GitHub金鑰）
function share(){
  const tok=ghToken;

  shareBox(text);
}
function shareBox(text){

  const t=document.createElement("textarea");t.readOnly=true;t.value=text;t.style.cssText="width:100%;box-sizing:border-box;min-height:70px;font:13px/1.4 monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit";
  const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  const mk=(l,f)=>{const x=document.createElement("button");x.type="button";x.className="act";x.textContent=l;x.style.cssText="padding:6px 12px";x.onclick=f;row.appendChild(x);return x};
  const st=document.createElement("span");st.style.color="var(--muted,var(--mute))";
  const cp=mk("複製",()=>{const ok=()=>{st.textContent="已複製，貼到LINE傳給同事或自己"};
    try{navigator.clipboard.writeText(text).then(ok,()=>{t.select();try{document.execCommand("copy");ok()}catch(_){st.textContent="請手動全選複製"}})}catch(_){t.select();try{document.execCommand("copy");ok()}catch(e){st.textContent="請手動全選複製"}}});
  if(navigator.share&&matchMedia("(pointer:coarse)").matches)mk("分享…",()=>navigator.share({text}).catch(()=>{}));
  mk("關閉",()=>b.remove());row.appendChild(st);
  b.append("連結含金鑰，只傳給同事或自己備份：",t,row);
  document.querySelector(".sub").after(b);

/* ---------- GitHub 儲存層（私人專案 eco-field-data）：模擬原本 db/assets 介面，其餘程式不用改 ----------
   cases/<caseId>.json 案件；records/<caseId>.json {紀錄id:紀錄}；checkres/<caseId>.json {核對id:結果}；files/<id> 照片與平面圖 */
// 資料專案的擁有者＝網址的帳號（xxx.github.io → xxx），搬到別的帳號/組織不用改程式
const GH_OWNER=/\.github\.io$/.test(location.hostname)?location.hostname.split(".")[0]:"tw0428";
const GH_REPO_URL=`https://api.github.com/repos/${GH_OWNER}/eco-field-data`;
const GH_API=GH_REPO_URL+"/contents/";
let ghToken=lsGet("gh-token");
async function gh(path,opt={}){
  // 訊號極差時fetch可能一直掛著：讀30秒、寫45秒逾時，逾時算網路錯誤（新紀錄會轉成待上傳）
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),opt.method&&opt.method!=="GET"?45000:30000);
  try{
    const r=await fetch(GH_API+path.split("/").map(encodeURIComponent).join("/"),{cache:"no-store",...opt,signal:ac.signal,
      headers:{Authorization:"Bearer "+ghToken,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
    if(r.status===404)return null;
    if(!r.ok){const e=new Error("GitHub "+r.status);e.code=r.status===401||r.status===403?"bad_token":r.status===409||r.status===422?"conflict":"http_"+r.status;throw e}
    return r;
  }finally{clearTimeout(tm)}
}
// 沒訊號／逾時／GitHub暫時故障 → 可以先存手機稍後重傳；金鑰錯誤等則不是
const isNetErr=e=>!e||navigator.onLine===false||e.name==="TypeError"||e.name==="AbortError"||/^http_5/.test(e.code||"")||(!e.code&&/fetch|network|load failed/i.test(e.message||""));
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const blobB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b)});
const newId=()=>crypto.randomUUID().replace(/-/g,"");
async function getJson(path){const r=await gh(path);if(!r)return {data:null,sha:null};const j=await r.json();return {data:JSON.parse(b64d(j.content)),sha:j.sha}}
async function putB64(path,b64,sha,msg){return gh(path,{method:"PUT",body:JSON.stringify({message:msg||"update "+path,content:b64,...(sha?{sha}:{})})})}
// GitHub同一分支同時兩筆寫入會409 → 所有寫入排隊一筆一筆送，撞到仍重試
let wq=Promise.resolve();
function serial(fn){const p=wq.then(fn,fn);wq=p.catch(()=>{});return p}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 讀最新→套用修改→寫回；別台裝置同時改過（衝突）時重讀重做
// 上次寫入後記住內容與sha：同一檔連續修改時直接寫（省一次讀取）；別台改過會衝突，再改回先讀最新
const shaC={};
function mutate(path,fn){return serial(async()=>{
  for(let i=0;;i++){
    const k=i===0&&shaC[path];const {data,sha}=k?k:await getJson(path);const next=fn(data);
    try{
      if(next==null){delete shaC[path];if(sha)await gh(path,{method:"DELETE",body:JSON.stringify({message:"delete "+path,sha})});return null}
      const r=await putB64(path,b64e(JSON.stringify(next,null,1)),sha);
      try{shaC[path]={sha:(await r.json()).content.sha,data:next}}catch(e){delete shaC[path]}
      return next;
    }catch(e){delete shaC[path];if(e.code!=="conflict"||i>=4)throw e;if(!k)await sleep(800*(i+1))}
  }
})}
function putNew(path,b64,m){return serial(async()=>{
  for(let i=0;;i++){try{return await putB64(path,b64,null,m)}catch(e){if(e.code!=="conflict"||i>=4)throw e;await sleep(800*(i+1))}}
})}
const store={cases:{},records:{},checkres:{}},subs={cases:[],records:[],checkres:[]};
function emit(col){const docs=Object.entries(store[col]).map(([id,d])=>({id,data:()=>d}));
  if(col==="cases")docs.sort((a,b)=>(a.data().createdAt||0)-(b.data().createdAt||0));
  subs[col].forEach(f=>f({docs}))}
let loadedAt=0,loadMode="";
const CACHE_KEY="eco-cache-field";
function applyStore(nc,nr,nk){store.cases=nc;store.records=nr;store.checkres=nk;emit("cases");emit("records");emit("checkres");
  lsSet(CACHE_KEY,JSON.stringify({cases:nc,records:nr,checkres:nk}))}
// 開啟時先顯示手機上暫存的上一份資料（秒開），背景再抓最新
function loadCache(){try{const c=JSON.parse(lsGet(CACHE_KEY)||"null");if(!c)return false;store.cases=c.cases||{};store.records=c.records||{};store.checkres=c.checkres||{};emit("cases");emit("records");emit("checkres");return true}catch(e){return false}}
// GraphQL一次請求拿到三個資料夾所有JSON內容（REST要先列清單再逐檔抓）
async function gql(query){
  const r=await fetch("https://api.github.com/graphql",{method:"POST",cache:"no-store",headers:{Authorization:"Bearer "+ghToken,"Content-Type":"application/json"},body:JSON.stringify({query})});
  if(r.status===401){const e=new Error("401");e.code="bad_token";throw e}
  if(!r.ok){const e=new Error("graphql "+r.status);e.code="gql_"+r.status;throw e}
  return r.json();
}
const TREE_FRAG="fragment T on Tree{entries{name object{... on Blob{text}}}}";
const treeFiles=o=>((o&&o.entries)||[]).filter(f=>f.name.endsWith(".json")&&f.object&&f.object.text!=null).map(f=>[f.name.slice(0,-5),JSON.parse(f.object.text)]);
async function loadAll(){
  let repo=null;
  try{const j=await gql(`query{repository(owner:"${GH_OWNER}",name:"eco-field-data"){c:object(expression:"HEAD:cases"){...T} r:object(expression:"HEAD:records"){...T} k:object(expression:"HEAD:checkres"){...T}}} ${TREE_FRAG}`);
    repo=j.data&&j.data.repository;
    if(!repo&&(j.errors||[]).some(x=>x.type==="NOT_FOUND")){const e=new Error("no repo");e.code="no_repo";throw e}
  }catch(e){if(e.code==="bad_token"||e.code==="no_repo")throw e;repo=null}
  if(!repo){loadMode="（逐檔）";return loadAllRest()} // GraphQL不能用時退回逐檔讀
  loadMode="";
  const nc={},nr={},nk={};
  treeFiles(repo.c).forEach(([id,d])=>{nc[id]=d});
  treeFiles(repo.r).forEach(([,m])=>Object.assign(nr,m||{}));
  treeFiles(repo.k).forEach(([,m])=>Object.assign(nk,m||{}));
  loadedAt=Date.now();applyStore(nc,nr,nk);
}
async function loadAllRest(){
  await repoCheck();
  const r=await gh("cases");const list=r?await r.json():[];
  const nc={},nr={},nk={};
  await Promise.all(list.filter(f=>f.name.endsWith(".json")).map(async f=>{const cid=f.name.slice(0,-5);
    const [c,rs,ks]=await Promise.all([getJson("cases/"+f.name),getJson("records/"+f.name),getJson("checkres/"+f.name)]);
    if(c.data)nc[cid]=c.data;Object.assign(nr,rs.data||{});Object.assign(nk,ks.data||{})}));
  loadedAt=Date.now();applyStore(nc,nr,nk);
}
async function write(col,id,kind,d){
  if(col==="cases"){
    const res=await mutate(`cases/${id}.json`,old=>kind==="delete"?null:kind==="set"?d:{...(old||{}),...d});
    if(res==null)delete store.cases[id];else store.cases[id]=res;emit(col);lsSet(CACHE_KEY,JSON.stringify(store));return;
  }
  const cid=(d&&d.caseId)||(store[col][id]&&store[col][id].caseId);if(!cid)throw new Error("缺caseId");
  const res=await mutate(`${col}/${cid}.json`,old=>{const m={...(old||{})};
    if(kind==="delete")delete m[id];else m[id]=kind==="set"?d:{...(m[id]||{}),...d};return m});
  for(const k of Object.keys(store[col]))if(store[col][k].caseId===cid&&!(k in res))delete store[col][k];
  Object.assign(store[col],res);emit(col);
  lsSet(CACHE_KEY,JSON.stringify(store));
}
const ghDb={
  collection(col){return {orderBy(){return this},onSnapshot(cb){subs[col].push(cb);return ()=>{}},doc(id){return ghDb.doc(col+"/"+(id||newId()))}}},
  doc(p){const [col,id]=p.split("/");return {id,set:d=>write(col,id,"set",d),update:d=>write(col,id,"update",d),delete:()=>write(col,id,"delete")}}
};
const ghAssets={
  async upload(blob){const id=newId();await putNew("files/"+id,await blobB64(blob),"file "+id);return {id}},
  delete(id){return serial(async()=>{const r=await gh("files/"+id);if(!r)return;const j=await r.json();await gh("files/"+id,{method:"DELETE",body:JSON.stringify({message:"delete file "+id,sha:j.sha})})})}
};
// 私人專案的照片要帶金鑰讀取，轉成本機網址顯示
const blobCache=new Map();
// 照片/平面圖上傳後不會再改 → 下載過一次就存在手機（Cache Storage），之後直接讀
const FILE_CACHE="eco-files",fileKey=id=>location.origin+"/__files/"+id;
async function fileBlob(id,type){
  let b=null;
  try{const c=await caches.open(FILE_CACHE);const hit=await c.match(fileKey(id));if(hit)b=await hit.blob()}catch(e){}
  if(!b){const r=await gh("files/"+id,{headers:{Accept:"application/vnd.github.raw+json"}});if(!r)throw new Error("找不到檔案");b=await r.blob();
    try{const c=await caches.open(FILE_CACHE);await c.put(fileKey(id),new Response(b))}catch(e){}}
  return type?new Blob([b],{type}):b;
}
// 顯示用的照片也寫回紀錄的GPS與拍攝時間：長按存到手機的照片才有定位
const photoRec=new Map();
function blobUrl(id,type){if(!blobCache.has(id))blobCache.set(id,fileBlob(id,type).then(async b=>{const r=photoRec.get(id);if(r)b=await withExif(b,r.lat,r.lng,exifDt(r));return URL.createObjectURL(b)}).catch(e=>{blobCache.delete(id);throw e}));return blobCache.get(id)}
function setImg(img,id){blobUrl(id,"image/jpeg").then(u=>{img.src=u}).catch(()=>{img.alt="載入失敗"})}

/* ---------- 離線待上傳（IndexedDB）：沒訊號時新紀錄、核對結果先存手機，有訊號自動補傳 ----------
   紀錄 {qid:"rec_<紀錄id>",kind:"record",recId,doc,photos:[{buf,type}],uploaded:[已傳照片id],at}
   核對 {qid:"chk_<核對id>",kind:"check",rid,doc,at}（同一天同案只留最新一份） */
let outbox=[],flushing=false,obErr="";
// iOS主畫面App第一次開時indexedDB.open可能一直不回應 → 3秒逾時，成功的連線留著重用
let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{const tm=setTimeout(()=>rej(new Error("idb_timeout")),3000);
  try{const r=indexedDB.open("eco-outbox",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"qid"});
    r.onsuccess=()=>{clearTimeout(tm);res(r.result)};r.onerror=r.onblocked=()=>{clearTimeout(tm);rej(r.error||new Error("idb_blocked"))}}catch(e){clearTimeout(tm);rej(e)}});
  idbP.catch(()=>{idbP=null});return idbP}
async function obTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("q",mode);const out=fn(t.objectStore("q"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
const obLoad=async()=>{try{outbox=(await obTx("readonly",s=>s.getAll()))||[]}catch(e){outbox=[]}};
const obPut=it=>{const {_urls,...rest}=it;return obTx("readwrite",s=>s.put(rest))};
async function obRemove(qid){const it=outbox.find(x=>x.qid===qid);if(!it)return;(it._urls||[]).forEach(u=>URL.revokeObjectURL(u));
  outbox=outbox.filter(x=>x.qid!==qid);try{await obTx("readwrite",s=>s.delete(qid))}catch(e){}renderOutbox()}
async function obAddRecord(recId,doc,blobs,uploaded){
  const photos=await Promise.all(blobs.map(async b=>({buf:await b.arrayBuffer(),type:b.type||"image/jpeg"})));
  const it={qid:"rec_"+recId,kind:"record",recId,doc,photos,uploaded:uploaded||[],at:Date.now()};
  await obPut(it);outbox.push(it);renderOutbox();
}
async function obAddCheck(rid,doc){const it={qid:"chk_"+rid,kind:"check",rid,doc,at:Date.now()};await obPut(it);outbox=outbox.filter(x=>x.qid!==it.qid);outbox.push(it);renderOutbox()}
// 新紀錄：有訊號直接存，沒訊號或中途斷線就整筆轉成待上傳（已傳好的照片id一起記著，補傳時不重傳）
async function saveNew(doc,blobs){
  const recId=newId(),ids=[];
  if(navigator.onLine!==false){
    try{for(const b of blobs)ids.push((await assets.upload(b)).id);
      await db.collection("records").doc(recId).set({...doc,photos:ids});return "saved"}
    catch(e){if(!isNetErr(e))throw e}
  }
  await obAddRecord(recId,doc,blobs,ids);return "queued";
}
async function flushOutbox(){
  if(flushing||!ghToken||!outbox.length||navigator.onLine===false)return;
  flushing=true;obErr="";renderOutbox();
  try{
    for(const it of [...outbox].sort((a,b)=>a.at-b.at)){
      if(it.kind==="record"){
        const ids=it.uploaded||[];
        for(let i=ids.length;i<it.photos.length;i++){const p=it.photos[i];ids.push((await assets.upload(new Blob([p.buf],{type:p.type}))).id);it.uploaded=ids;await obPut(it)}
        await db.collection("records").doc(it.recId).set({...it.doc,photos:ids});
      }else if(it.kind==="check")await db.doc("checkres/"+it.rid).set(it.doc);
      await obRemove(it.qid);
    }
  }catch(e){obErr=isNetErr(e)?"":"補傳失敗（"+(e.code||e.message)+"），稍後會再試"}
  finally{flushing=false;renderOutbox()}
}
function renderOutbox(){
  const box=$("obBox");if(!box)return;box.hidden=!outbox.length;if(!outbox.length)return;
  const recs=outbox.filter(i=>i.kind==="record"),chks=outbox.filter(i=>i.kind==="check");
  $("obCount").textContent=`${outbox.length} 筆`;
  $("obMsg").textContent=flushing?"上傳中…":obErr||(navigator.onLine===false?"目前沒訊號，有訊號時會自動上傳":"有訊號時會自動上傳，也可以按「立即上傳」");
  $("obFlush").disabled=flushing;
  const list=$("obList");list.innerHTML="";
  recs.forEach(it=>{
    const d=it.doc,el=document.createElement("article");el.className="rec";
    const head=document.createElement("div");head.className="head";
    const t=document.createElement("span");t.className="pill no";t.textContent="待上傳";
    const c=document.createElement("span");c.className="pill";c.textContent=(d.stage?d.stage+"｜":"")+d.category+(d.abcd?" "+d.abcd:"");
    const cn=document.createElement("span");cn.textContent=(cases.find(x=>x.id===d.caseId)||{}).name||"";
    head.append(t,c,cn);if(d.stake){const s=document.createElement("span");s.textContent=d.stake;head.appendChild(s)}
    el.appendChild(head);
    const txt=[d.species,d.count,d.note].filter(Boolean).join("　");if(txt){const n=document.createElement("div");n.className="note";n.textContent=txt;el.appendChild(n)}
    if(it.photos.length){it._urls=it._urls||it.photos.map(p=>URL.createObjectURL(new Blob([p.buf],{type:p.type})));
      const im=document.createElement("div");im.className="imgs";it._urls.forEach(u=>{const i=document.createElement("img");i.src=u;i.alt="待上傳照片";im.appendChild(i)});el.appendChild(im)}
    const acts=document.createElement("div");acts.className="acts";const del=document.createElement("button");del.type="button";del.className="danger";del.textContent="刪除";
    del.onclick=()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="再按一次確認刪除";setTimeout(()=>{del.dataset.armed="";del.textContent="刪除"},4000);return}obRemove(it.qid)};
    acts.appendChild(del);el.appendChild(acts);list.appendChild(el);
  });
  if(chks.length){const n=document.createElement("div");n.className="hint";n.textContent=`另有 ${chks.length} 份核對結果待上傳`;list.appendChild(n)}
}

/* ---------- 手機定位：獨立網頁可以用定位，拍照時自動帶入 ---------- */
let geo=null,geoWatch=null,geoErr="";
function geoStart(){
  if(geoWatch!=null||!navigator.geolocation)return;
  geoWatch=navigator.geolocation.watchPosition(
    p=>{geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:Date.now()};geoErr="";renderGeo()},
    e=>{geoErr=e.code===1?"定位被拒：iPhone設定→隱私權與安全性→定位服務→Safari網站設為「使用App期間」，並在Safari網址列左側選單→網站設定→位置改允許":"定位訊號不足，到空曠處再試";
      if(e.code===1){navigator.geolocation.clearWatch(geoWatch);geoWatch=null}renderGeo()},
    {enableHighAccuracy:true,maximumAge:30000,timeout:30000});
}
const geoFresh=()=>geo&&Date.now()-geo.t<120000?geo:null;
async function geoWait(ms){geoStart();const t0=Date.now();while(!geoFresh()&&!geoErr&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,500));return geoFresh()}
function renderGeo(){const e=$("geoState");const g=geoFresh();
  e.textContent=g?`📍 定位 ±${g.acc}m（拍照會自動帶入）`:geoErr?"📍 "+geoErr:geoWatch!=null?"📍 取得定位中…":"";e.hidden=!e.textContent;renderNear()}

/* ---------- EXIF (JPEG) : 拍攝時間與GPS ---------- */
async function readExif(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};
    let off=2;
    while(off+4<v.byteLength){
      const mk=v.getUint16(off);if((mk&0xFF00)!==0xFF00)break;
      const len=v.getUint16(off+2);
      if(mk===0xFFE1&&v.getUint32(off+4)===0x45786966)return parseTiff(v,off+10);
      off+=2+len;
    }
  }catch(e){}
  return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949;
  const u16=o=>v.getUint16(t+o,le),u32=o=>v.getUint32(t+o,le);
  const ifd=o=>{const n=u16(o),tags={};for(let i=0;i<n;i++){const e=o+2+i*12;tags[u16(e)]={count:u32(e+4),vo:e+8}}return tags};
  const rat=(tag)=>{const o=u32(tag.vo),out=[];for(let i=0;i<tag.count;i++){const a=u32(o+i*8),b=u32(o+i*8+4);out.push(b?a/b:0)}return out};
  const asc=(tag)=>{const o=tag.count>4?u32(tag.vo):tag.vo;let s="";for(let i=0;i<tag.count;i++){const c=v.getUint8(t+o+i);if(!c)break;s+=String.fromCharCode(c)}return s};
  const out={};
  try{
    const i0=ifd(u32(4));
    if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const d=ex[0x9003]||ex[0x9004];if(d)out.taken=asc(d)}
    if(!out.taken&&i0[0x0132])out.taken=asc(i0[0x0132]);
    if(i0[0x8825]){
      const g=ifd(u32(i0[0x8825].vo));
      if(g[2]&&g[4]){
        const dms=a=>a[0]+a[1]/60+a[2]/3600;
        let lat=dms(rat(g[2])),lng=dms(rat(g[4]));
        if(g[1]&&asc(g[1])==="S")lat=-lat;
        if(g[3]&&asc(g[3])==="W")lng=-lng;
        if(lat||lng){out.lat=+lat.toFixed(6);out.lng=+lng.toFixed(6)}
      }
    }
  }catch(e){}
  return out;
}
function fmtExifTime(s){const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(s||"");return m?`${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`:""}
function fmtMs(ms){const d=new Date(ms),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ---------- 壓縮照片（長邊1920px） ---------- */
async function compress(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,s=Math.min(1,1920/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

/* ---------- 樁號推估：把GPS投影到設計中心線 ---------- */
function fmtSt(st){const k=Math.floor(st/1000),m=st-k*1000;return `${k}K+${String(Math.round(m)).padStart(3,"0")}`}
function nearestStation(lat,lng){
  const c=cases.find(x=>x.id===curCase);const s=c&&Array.isArray(c.stakes)?c.stakes:null;if(lat==null)return null;
  if((!s||s.length<2)&&c&&c.sites&&c.sites.length){ // 無樁號的案子：找最近的工區標示點
    const kx=Math.cos(lat*Math.PI/180)*111320,ky=110540;let b=null;
    c.sites.forEach(p=>{const d=Math.hypot((p.lng-lng)*kx,(p.lat-lat)*ky);if(!b||d<b.off)b={site:p.label,off:d}});return b;
  }
  if(!s||s.length<2)return null;
  const lat0=s[0].lat,kx=Math.cos(lat0*Math.PI/180)*111320,ky=110540;
  const P=p=>[(p.lng-s[0].lng)*kx,(p.lat-lat0)*ky];const q=P({lat,lng});
  let best=null;
  for(let i=0;i<s.length-1;i++){
    const a=P(s[i]),b=P(s[i+1]),dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
    let t=((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
    const px=a[0]+t*dx,py=a[1]+t*dy,d=Math.hypot(q[0]-px,q[1]-py);
    if(!best||d<best.off)best={st:s[i].st+t*(s[i+1].st-s[i].st),off:d};
  }
  return best;
}
function fillOf(r){if(!r)return "";return r.site?(r.off<=1500?r.site:""):(r.off<=60?`約${fmtSt(r.st)}`:"")}
function stationText(r){if(!r)return "";if(r.site)return r.off>1500?`離最近工區${(r.off/1000).toFixed(1)}km，可能不在工區`:`近${r.site}（離工區標示點${Math.round(r.off)}m）`;return r.off>60?`距中心線${Math.round(r.off)}m，可能不在工區`:`約${fmtSt(r.st)}（距中心線${Math.round(r.off)}m）`}
function suggestStake(){
  const gp=pending.find(p=>p.ex.lat!=null);
  if(!gp){const c=cases.find(x=>x.id===curCase);if(pending.length&&c&&(c.stakes||c.sites)){$("stakeHint").textContent="照片無GPS，點樁號欄可從清單選";$("stakeHint").hidden=false}return}
  const r=nearestStation(gp.ex.lat,gp.ex.lng);if(!r)return;
  if(!$("stakeIn").value.trim()&&fillOf(r))$("stakeIn").value=fillOf(r);
  $("stakeHint").textContent="GPS推估："+stationText(r);$("stakeHint").hidden=false;
}

async function addFiles(list,fromCam){
  const add=[];
  for(const f of list){
    const ex=await readExif(f);
    // 照片本身沒GPS、且是剛拍的（工具內拍照）→ 用拍照當下的手機定位
    // 不用檔案修改時間判斷：從工具下載的照片再選回來，修改時間是下載當下，會誤用現在位置；改看照片內的拍攝時間
    const tk=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(ex.taken||""),tkMs=tk?new Date(+tk[1],tk[2]-1,+tk[3],+tk[4],+tk[5]).getTime():0;
    ex.fresh=ex.lat==null&&(fromCam||(tkMs&&Math.abs(Date.now()-tkMs)<300000));
    const p={file:f,url:URL.createObjectURL(f),ex};pending.push(p);add.push(p);if(fromCam){camFiles.push(f);camKeep(f)}
  }
  renderPending();renderAlbum();
  if(fromCam){const fm=$("recForm").getBoundingClientRect();if(fm.top<0||fm.top>innerHeight*0.6)$("pendThumbs").scrollIntoView({behavior:"smooth",block:"center"})}
  if(add.some(p=>p.ex.fresh)){
    const g=geoFresh()||await geoWait(10000);
    if(g)add.forEach(p=>{if(p.ex.fresh)Object.assign(p.ex,{lat:g.lat,lng:g.lng,acc:g.acc,src:"device"})});
    else showMsg(geoErr||"還沒取得定位，這張照片沒有GPS，可從樁號清單選位置。",true);
    renderPending();
  }
  suggestStake();
}
function renderPending(){
  const box=$("pendThumbs");box.innerHTML="";
  // 編輯時先列出原有照片（可移除），點了看大圖
  if(editing)editKeep.forEach((id,i)=>{
    const d=document.createElement("div");d.className="thumb";
    const im=document.createElement("img");setImg(im,id);im.alt="原有照片";im.style.cursor="pointer";im.onclick=()=>openViewer(id,"image/jpeg","原有照片");
    const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","從這筆紀錄移除");

    const o=document.createElement("span");o.className="old";o.textContent="原有";
    d.append(im,x,o);box.appendChild(d);
  });
  pending.forEach((p,i)=>{
    const d=document.createElement("div");d.className="thumb";
    const im=document.createElement("img");im.src=p.url;im.alt="待上傳照片";
    const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","移除這張");

    g.textContent=p.ex.lat!=null?`${p.ex.lat}, ${p.ex.lng}`+(p.ex.src==="device"?` ±${p.ex.acc}m`:""):p.ex.fresh&&!geoErr?"定位中…":"無GPS";
    d.append(im,x,g);box.appendChild(d);
  });
  $("batchBtn").hidden=pending.length<2||!!editing;
}

/* ---------- 批次：每張照片各一筆，說明之後補 ---------- */
$("batchBtn").onclick=async()=>{
  if(saving)return;
  if(!db||!assets){showMsg("尚未連上儲存空間，請確認已登入claude.ai並重新整理。",true);return}
  if(!curCase){showMsg("請先選擇或新增案件。",true);return}
  const f={count:$("countIn").value.trim(),species:$("spIn").value.trim(),note:$("noteIn").value.trim()};
  const manualStake=$("stakeIn").value.trim(),autoFilled=manualStake.startsWith("約");
  const by=whoAsk();
  saving=true;$("saveBtn").disabled=true;$("batchBtn").disabled=true;
  const total=pending.length;let done=0,queued=0;
  try{
    while(pending.length){
      const p=pending[0];
      showMsg(`建立紀錄 ${done+queued+1}/${total}…`);
      let blob;try{blob=await compress(p.file)}catch(err){blob=p.file}
      const ns=p.ex.lat!=null?nearestStation(p.ex.lat,p.ex.lng):null;
      const stake=manualStake&&!autoFilled?manualStake:fillOf(ns);
      const r=await saveNew({caseId:curCase,category:cat,abcd:isFM(cat)?abcd:"",...f,stake,stage:curStage(),...(by?{by}:{}),...(linkCheck?{checkId:linkCheck}:{}),
        createdAt:Date.now(),takenAt:p.ex.taken?fmtExifTime(p.ex.taken):"",
        lat:p.ex.lat!=null?p.ex.lat:null,lng:p.ex.lat!=null?p.ex.lng:null,gpsSource:p.ex.lat!=null?(p.ex.src||"exif"):"none",...(p.ex.acc!=null?{gpsAcc:p.ex.acc}:{})},[blob]);
      r==="queued"?queued++:done++;
      URL.revokeObjectURL(p.url);pending.shift();renderPending();
    }
    clearForm();showMsg(queued?`已存 ${done} 筆；${queued} 筆沒訊號，先存在手機（見上方「待上傳」），有訊號會自動上傳。`:`已建立 ${done} 筆紀錄，之後在列表按「編輯」補說明。`,queued>0);
  }catch(err){
    renderPending();
    showMsg(`已存 ${done+queued} 筆，第 ${done+queued+1} 張失敗（${(err&&err.code)||"錯誤"}）。剩下 ${pending.length} 張還在上面。`,true);
  }finally{saving=false;$("saveBtn").disabled=false;$("batchBtn").disabled=false}
};

/* ---------- 頁內檢視器：圖片／PDF，可縮放、雙指縮放 ---------- */
let vZoom=1,vBase=[],vToken=0;
function vApply(){
  const items=$("vContent").children;
  for(let i=0;i<items.length;i++){const w=vBase[i];if(w)items[i].style.width=Math.round(w*vZoom)+"px"}
}
function vFit(){const w=$("vStage").clientWidth-4;const mx=Math.max(...vBase.filter(Boolean),1);vZoom=w/mx;vApply()}
function vSetZoom(z,cx,cy){
  const st=$("vStage"),old=vZoom;z=Math.max(0.1,Math.min(6,z));
  const px=(st.scrollLeft+(cx??st.clientWidth/2))/old,py=(st.scrollTop+(cy??st.clientHeight/2))/old;
  vZoom=z;vApply();
  st.scrollLeft=px*z-(cx??st.clientWidth/2);st.scrollTop=py*z-(cy??st.clientHeight/2);
}
let downloads=null,vCur=null;
$("vSave").onclick=async()=>{
  if(!downloads||!vCur)return;const b=$("vSave"),old=b.textContent;
  try{
    b.disabled=true;b.textContent="準備中…";
    const blob=await fileBlob(vCur.id,vCur.type);
    const ext=vCur.type==="application/pdf"?"pdf":vCur.type==="image/png"?"png":"jpg";
    const name=(vCur.title||"檔案").replace(/[\\/:*?"<>|]/g,"_")+"."+ext;
    await downloads.save({filename:name,data:blob});b.textContent="已下載";
  }catch(e){b.textContent=e&&e.code==="declined"?old:"下載失敗"}
  finally{b.disabled=false;setTimeout(()=>{b.textContent=old},2000)}
};
// PDF元件約1.3MB：只在真的開PDF時才下載（原本開頁就載，拖慢首次開啟）
let pdfReady=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfReady)pdfReady=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res()};
    s.onerror=()=>{pdfReady=null;rej(new Error("PDF元件載入失敗，請確認網路"))};document.head.appendChild(s)});
  return pdfReady;
}
async function openViewer(id,type,title){
  vCur={id,type,title};$("vSave").hidden=!downloads;
  const tok=++vToken;$("vTitle").textContent=title;$("viewer").hidden=false;document.body.style.overflow="hidden";
  const box=$("vContent");box.innerHTML='<div class="vmsg">載入中…</div>';vBase=[];
  try{
    if(type==="application/pdf"){
      await loadPdfJs();
      const buf=await (await fileBlob(id)).arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      if(tok!==vToken)return;box.innerHTML="";
      for(let n=1;n<=pdf.numPages;n++){
        const page=await pdf.getPage(n),vp=page.getViewport({scale:2});
        const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        if(tok!==vToken)return;box.appendChild(cv);vBase.push(vp.width/2);
        if(n===1)vFit();else vApply();
      }
    }else{
      const img=new Image();img.alt=title;
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;blobUrl(id,type).then(u=>{img.src=u},rej)});
      if(tok!==vToken)return;box.innerHTML="";box.appendChild(img);vBase=[img.naturalWidth];vFit();
    }
  }catch(e){if(tok===vToken)box.innerHTML='<div class="vmsg">無法開啟這個檔案（'+(e.message||"載入失敗")+'）。</div>'}
}
function closeViewer(){vToken++;$("viewer").hidden=true;$("vContent").innerHTML="";document.body.style.overflow=""}
$("vClose").onclick=closeViewer;
$("vIn").onclick=()=>vSetZoom(vZoom*1.5);
$("vOut").onclick=()=>vSetZoom(vZoom/1.5);
$("vFit").onclick=vFit;
(()=>{const st=$("vStage");const pts=new Map();let d0=0,z0=1;
  const dist=()=>{const p=[...pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
  st.addEventListener("pointerdown",e=>{try{st.setPointerCapture(e.pointerId)}catch(_){};pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){d0=dist();z0=vZoom}});
  st.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){st.scrollLeft-=e.clientX-prev.x;st.scrollTop-=e.clientY-prev.y;return}
    if(pts.size===2&&d0){const p=[...pts.values()],r=st.getBoundingClientRect();vSetZoom(z0*dist()/d0,(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top)}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)d0=0};
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  st.addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();const r=st.getBoundingClientRect();vSetZoom(vZoom*(e.deltaY<0?1.1:0.9),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
})();

function renderPlans(c){
  const box=$("planBox"),list=$("planList");

    const row=document.createElement("div");row.className="planitem";

      del.onclick=async()=>{
        if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="確認移除";setTimeout(()=>{del.dataset.armed="";del.textContent="移除"},4000);return}
        del.disabled=true;
        try{const plans=(c.plans||[]).filter((_,j)=>j!==i);await db.doc("cases/"+c.id).update({plans});try{await assets.delete(p.id)}catch(e){}}

/* ---------- 現場核對清單（案件 checks:[{id,abcd,text,stake,src}]；
   勾選依現勘日存 checkres/<caseId>_<YYYYMMDD> {caseId,date,stage,st}，未勾的顯示上次結果） ---------- */
let checkRes={},linkCheck=null,chkEditId=null,chkCase=null,chkSort=null;
const CHK_ST=[["ok","✓ 落實"],["ng","✗ 未落實"],["na","－ 未施作"]];
// 開工前：只核對設計階段意見（phase:"design"），確認能否落實；設計階段不顯示清單
const CHK_PRE=[["ok","✓ 可落實"],["adj","△ 需調整"],["ng","✗ 無法落實"]];
// 設計：只核對提審階段意見（phase:"report"），確認設計是否納入
const CHK_DES=[["ok","✓ 已納入"],["adj","△ 部分納入"],["ng","✗ 未納入"]];
const stLabels=stage=>stage==="開工前"?CHK_PRE:stage==="設計"?CHK_DES:CHK_ST;
const stLabel=(stage,k)=>((stLabels(stage).find(s=>s[0]===k)||CHK_ST.find(s=>s[0]===k)||[,k])[1]);
function today(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}
function resId(){return curCase+"_"+today()}
// 設計階段另一區：本團隊預計提出的意見（phase:"propose"），現場記錄設計單位能否採納
const CHK_PROP=[["ok","✓ 可採納"],["adj","△ 部分採納"],["ng","✗ 不採納"]];
const CHK_IMP=[["ok","✓ 已改善"],["adj","△ 改善中"],["ng","✗ 未改善"]];
function renderChecks(){
  // 正在打字時不重繪（樁號選單不算；換案件一定重繪，避免顯示上一案的清單與樁號）
  const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.chk&&ae.tagName!=="SELECT"&&chkCase===curCase)return;
  if(chkCase!==curCase){chkCase=curCase;chkEditId=null;chkSort=null}
  const c=cases.find(x=>x.id===curCase),stage=curStage(),all=(c&&c.checks)||[];
  if(linkCheck&&!all.find(i=>i.id===linkCheck))setLink(null);
  const repItems=stage==="提報"?[]:all.filter(i=>i.phase!=="propose"&&i.phase!=="improve"&&(stage==="設計"?i.phase==="report":stage==="開工前"?i.phase==="design":i.phase!=="report"));
  renderChkPanel({box:$("chkBox"),list:$("chkList"),title:$("chkTitle"),count:$("chkCount"),c,stage,
    items:repItems,
    canAdd:!!c&&stage!=="提報"&&!(stage==="設計"&&!repItems.length),labels:stLabels(stage),
    titleText:stage==="設計"?"提審意見納入確認":stage==="開工前"?"設計意見落實確認":"現場核對清單",
    addPhase:stage==="設計"?"report":stage==="開工前"?"design":"start",addLabel:"＋ 新增核對事項（會議、現場討論的新意見）"});
  // 第二區：設計＝預計提出意見；施工中／完工＝改善意見（phase:"improve"，追蹤是否改善）

  $("propHint").textContent=imp?"施工中發現的問題與改善意見，之後每次現勘追蹤改善情形。":"本團隊準備提給設計單位的意見，現場討論後記錄採納情形。";
  renderChkPanel({box:$("propBox"),list:$("propList"),title:$("propTitle"),count:$("propCount"),c,stage,
    items:stage==="設計"?all.filter(i=>i.phase==="propose"):imp?all.filter(i=>i.phase==="improve"):[],
    canAdd:!!c&&(stage==="設計"||imp),labels:imp?CHK_IMP:CHK_PROP,
    titleText:imp?"改善意見（追蹤改善情形）":"預計提出意見（現場確認能否採納）",
    addPhase:imp?"improve":"propose",addLabel:imp?"＋ 新增改善意見":"＋ 新增預計提出的意見"});

function renderChkPanel({box,list,title,count,c,stage,items,canAdd,labels,titleText,addPhase,addLabel}){
  items=[...items];
  box.hidden=!items.length&&!canAdd;list.innerHTML="";
  if(box.hidden)return;
  if(title)title.textContent=titleText;
  const st=(checkRes[resId()]&&checkRes[resId()].st)||{},notes=(checkRes[resId()]&&checkRes[resId()].notes)||{};
  const past=Object.values(checkRes).filter(d=>d.caseId===curCase&&d.date<today()).sort((a,b)=>b.date.localeCompare(a.date));
  const lastOf=it=>{const d=past.find(d=>d.st&&d.st[it.id]);if(!d)return "";const k=d.st[it.id];
    const lb=it.phase==="propose"||it.phase==="improve"?(((it.phase==="propose"?CHK_PROP:CHK_IMP).find(s=>s[0]===k)||[,k])[1]):stLabel(d.stage,k);
    return `上次 ${d.date.slice(4,6)}/${d.date.slice(6)}${d.stage?" "+d.stage:""}：${lb}`};
  count.textContent=items.length?`今天已核對 ${items.filter(i=>st[i.id]).length}/${items.length}`:"";
  // 有 group（工區）時依群組首次出現順序分組並加標題
  const gOrder=[...new Set(items.map(i=>i.group||""))];
  if(gOrder.some(Boolean))items.sort((a,b)=>gOrder.indexOf(a.group||"")-gOrder.indexOf(b.group||""));
  // 調整順序：在手機上先改本機順序，按「完成排序」才一次存回（避免每按一下就上傳一次）
  const sorting=chkSort===box.id;
  const apply=arr=>{const ids=new Set(arr.map(i=>i.id));let k=0;c.checks=c.checks.map(i=>ids.has(i.id)?arr[k++]:i);renderChecks()};
  const mvItem=(it,d)=>{const arr=[...items],i=arr.indexOf(it),j=i+d;if(j<0||j>=arr.length||(arr[j].group||"")!==(it.group||""))return;[arr[i],arr[j]]=[arr[j],arr[i]];apply(arr)};
  const mvGrp=(g,d)=>{const o=[...gOrder],i=o.indexOf(g),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];apply([...items].sort((a,b)=>o.indexOf(a.group||"")-o.indexOf(b.group||"")))};
  const mvBtns=(up,dn,f)=>{const w=document.createElement("span");w.className="mv";
    [["▲",up,-1],["▼",dn,1]].forEach(([s,en,d])=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.disabled=!en;b.setAttribute("aria-label",d<0?"往上移":"往下移");b.onclick=()=>f(d);w.appendChild(b)});return w};
  if(c&&items.length>1){const tb=document.createElement("div");tb.className="sortbar";
    const sb=document.createElement("button");sb.type="button";sb.className=sorting?"mini primary":"mini";sb.textContent=sorting?"✓ 完成排序":"⇅ 調整順序";
    sb.onclick=async()=>{if(sorting){sb.disabled=true;chkSort=null;if(!await saveChecks(c.checks))renderChecks()}else{chkSort=box.id;chkEditId=null;renderChecks()}};
    tb.appendChild(sb);if(sorting){const h=document.createElement("span");h.className="hint";h.textContent="按 ▲▼ 移動；分類整組一起移";tb.appendChild(h)}
    list.appendChild(tb)}
  let lastG=null,dest=list;
  items.forEach(it=>{
    if(gOrder.some(Boolean)&&(it.group||"")!==lastG){lastG=it.group||"";
      const gi=items.filter(i=>(i.group||"")===lastG);
      const h=document.createElement("div");h.className="chkgroup";h.textContent=`${lastG||"其他"}（${gi.filter(i=>st[i.id]).length}/${gi.length}）`;
      if(sorting){const g=lastG,gi_=gOrder.indexOf(g);h.appendChild(mvBtns(gi_>0,gi_<gOrder.length-1,d=>mvGrp(g,d)))}
      dest=document.createElement("div");dest.className="chkgrp";dest.appendChild(h);list.appendChild(dest)}
    const el=document.createElement("div");el.className="chk"+(st[it.id]?" done":"");
    if(chkEditId===it.id){el.appendChild(chkEditForm(c,it,gOrder.filter(Boolean)));dest.appendChild(el);return}
    const tx=document.createElement("div");tx.className="txt";
    const p=document.createElement("span");p.className="pill";p.textContent=it.abcd||"—";
    tx.append(p," "+it.text);el.appendChild(tx);
    const n=records.filter(r=>r.caseId===curCase&&r.checkId===it.id).length;
    const m=document.createElement("div");m.className="meta";
    [it.stake,it.src,n?`已連結 ${n} 筆紀錄`:"",st[it.id]?"":lastOf(it)].filter(Boolean).forEach(s=>{const e=document.createElement("span");e.textContent=s;m.appendChild(e)});
    if(it.fig){const f=document.createElement("div");f.className="meta";f.textContent="圖："+it.fig;el.appendChild(f)}

    // 已連結紀錄的照片（點開看該筆紀錄）
    const lr=records.filter(r=>r.caseId===curCase&&r.checkId===it.id&&r.photos&&r.photos.length);
    if(lr.length){const g=document.createElement("div");g.className="chkph";
      lr.forEach(r=>r.photos.forEach(p=>{const a=document.createElement("a");a.href="#";a.onclick=ev=>{ev.preventDefault();openRec(r)};
        const i=document.createElement("img");i.alt="連結的照片";i.loading="lazy";setImg(i,p);a.appendChild(i);g.appendChild(a)}));
      el.appendChild(g)}

      const bs=document.createElement("div");bs.className="btns";const mv=mvBtns(sameG(ix-1),sameG(ix+1),d=>mvItem(it,d));mv.style.marginLeft="auto";
      bs.appendChild(mv);el.appendChild(bs);dest.appendChild(el);return}
    const bs=document.createElement("div");bs.className="btns";
    const sg=document.createElement("div");sg.className="seg";bs.appendChild(sg);
    labels.forEach(([k,label])=>{
      const b=document.createElement("button");b.type="button";b.textContent=label;if(k==="ng")b.className="ng";

    bs.appendChild(rb);
    // 預計提出意見、改善意見、現場新增的項目可修改內容

        saveChecks(((c.checks)||[]).filter(i=>i.id!==it.id))};bs.appendChild(dx)}
    el.appendChild(bs);
    if(st[it.id]==="adj"||st[it.id]==="ng"){
      const ta=document.createElement("textarea");ta.dataset.chk=it.id;ta.rows=2;
      ta.placeholder=it.phase==="improve"?(st[it.id]==="adj"?"目前改善進度":"未改善原因／後續要求"):it.phase==="propose"?(st[it.id]==="adj"?"設計單位的調整方式":"不採納原因（例：經費不足、水理安全）"):st[it.id]==="adj"?"調整方向（例：改設於0K+040下游側）":"原因（例：經費不足、現地無空間）";
      ta.value=(notes[it.id])||"";ta.onchange=()=>setCheck(it.id,st[it.id],ta.value.trim());
      ta.onblur=()=>setTimeout(renderChecks,0);
      el.appendChild(ta);
    }
    dest.appendChild(el);
  });

function recCard(r,c,onEdit){
    const el=document.createElement("article");el.className="rec "+stgCls(r.stage);
    const head=document.createElement("div");head.className="head";
    const t=document.createElement("span");t.className="pill "+stgCls(r.stage);t.textContent=(r.stage?r.stage+"｜":"")+r.category+(r.abcd?" "+r.abcd:"");

    head.append(t,time);

    if(!r.species&&!r.note){const w=document.createElement("span");w.className="pill no";w.textContent="待補說明";head.appendChild(w)}
    el.appendChild(head);
    if(r.species||r.count){const ti=document.createElement("div");ti.className="title";ti.textContent=[r.species,r.count].filter(Boolean).join("　");el.appendChild(ti)}
    if(r.note){const n=document.createElement("div");n.className="note";n.textContent=r.note;el.appendChild(n)}

      r.photos.forEach(p=>{const a=document.createElement("a");a.href="#";a.onclick=ev=>{ev.preventDefault();openViewer(p,"image/jpeg",r.species||"現場照片")};const i=document.createElement("img");setImg(i,p);i.alt="現場照片";i.loading="lazy";a.appendChild(i);im.appendChild(a)});

    if(r.checkId){const ck=((c.checks||[]).find(i=>i.id===r.checkId));if(ck){const s=document.createElement("span");s.textContent="核對："+ck.text.slice(0,14)+(ck.text.length>14?"…":"");m2.appendChild(s)}}
    if(r.lat!=null){
      const ns=nearestStation(r.lat,r.lng);
      const a=document.createElement("span");a.textContent=`📍${r.lat}, ${r.lng}`+(r.gpsSource==="device"?` ±${r.gpsAcc}m`:"")+(ns?"・"+stationText(ns):"");m2.appendChild(a);
    }else if(r.photos&&r.photos.length){const n=document.createElement("span");n.textContent="照片無GPS";m2.appendChild(n)}
    if(m2.childNodes.length)el.appendChild(m2);
    const acts=document.createElement("div");acts.className="acts";

    const db_=document.createElement("button");db_.type="button";db_.className="danger";db_.textContent="刪除";
    db_.onclick=async()=>{
      if(db_.dataset.armed!=="1"){db_.dataset.armed="1";db_.textContent="再按一次確認刪除";setTimeout(()=>{db_.dataset.armed="";db_.textContent="刪除"},4000);return}
      db_.disabled=true;

    };

/* ---------- 儲存 ---------- */
$("recForm").onsubmit=async e=>{
  e.preventDefault();if(saving)return;
  if(!db){showMsg("尚未連上儲存空間，請確認已登入claude.ai並重新整理。",true);return}
  if(!curCase){showMsg("請先選擇或新增案件。",true);return}
  const f={stake:$("stakeIn").value.trim(),count:$("countIn").value.trim(),species:$("spIn").value.trim(),note:$("noteIn").value.trim()};
  if(!pending.length&&!f.species&&!f.note&&!f.stake&&!editing){showMsg("至少拍一張照片或填一個欄位。",true);return}
  if(pending.length&&!assets){showMsg("這個檢視無法上傳照片（需用你自己的帳號開啟）。",true);return}
  saving=true;$("saveBtn").disabled=true;
  try{
    const blobs=[];
    for(let i=0;i<pending.length;i++){let blob;try{blob=await compress(pending[i].file)}catch(err){blob=pending[i].file}blobs.push(blob)}
    const gp=pending.find(p=>p.ex.lat!=null);const tp=pending.find(p=>p.ex.taken);
    const body={caseId:curCase,category:cat,abcd:isFM(cat)?abcd:"",...f};
    if(linkCheck)body.checkId=linkCheck;else if(editing&&editing.checkId)body.checkId="";
    if(!editing){body.stage=curStage();const by=whoAsk();if(by)body.by=by}
    // 列入改善追蹤：先在改善意見清單加一條，這筆紀錄連到它
    let impFail=false,impAdded=false;
    if(!editing&&!linkCheck&&!$("impBox").hidden&&$("impChk").checked){
      const c=cases.find(x=>x.id===curCase),d=new Date(),by=who();
      const item={id:"u"+Date.now().toString(36),abcd:"",text:f.note||f.species||"（待補說明）",stake:f.stake,
        src:`現場紀錄 ${d.getMonth()+1}/${d.getDate()}`+(by?" "+by:""),phase:"improve",added:true};
      if(c&&await saveChecks([...(c.checks||[]),item])){body.checkId=item.id;impAdded=true}else impFail=true;
    }
    let queued=false;
    if(editing){ // 編輯既有紀錄需要網路（不進待上傳）
      const ids=[];
      for(let i=0;i<blobs.length;i++){showMsg(`上傳照片 ${i+1}/${blobs.length}…`);ids.push((await assets.upload(blobs[i])).id)}
      const upd={...body,photos:[...editKeep,...ids]};
      const removed=(editing.photos||[]).filter(p=>!editKeep.includes(p));
      if(editing.lat==null&&gp){upd.lat=gp.ex.lat;upd.lng=gp.ex.lng;upd.gpsSource=gp.ex.src||"exif";if(gp.ex.acc!=null)upd.gpsAcc=gp.ex.acc}
      if(!editing.takenAt&&tp)upd.takenAt=fmtExifTime(tp.ex.taken);
      await db.doc("records/"+editing.id).update(upd);
      if(assets)for(const p of removed){try{await assets.delete(p)}catch(e){}}
      cancelEdit();
    }else{
      showMsg(blobs.length?`上傳照片（${blobs.length} 張）…`:"儲存中…");
      const doc={...body,createdAt:Date.now(),takenAt:tp?fmtExifTime(tp.ex.taken):"",
        lat:gp?gp.ex.lat:null,lng:gp?gp.ex.lng:null,gpsSource:gp?(gp.ex.src||"exif"):"none",...(gp&&gp.ex.acc!=null?{gpsAcc:gp.ex.acc}:{})};
      queued=(await saveNew(doc,blobs))==="queued";
    }
    clearForm();
    showMsg((queued?"沒訊號，已先存在手機（見上方「待上傳」），有訊號時會自動上傳。":gp||!blobs.length?"已儲存。":"已儲存。照片沒有帶GPS，記得在樁號欄補位置。")+(impFail?"（改善追蹤項目沒加成功，有訊號時到「改善意見」手動新增）":impAdded?"已列入改善意見清單。":""),queued||impFail||(!gp&&blobs.length>0));
  }catch(err){
    const c=err&&err.code;
    showMsg(editing&&isNetErr(err)?"編輯既有紀錄需要網路，資料還在表單上，有訊號時再按一次。":"儲存失敗（"+(c||"錯誤")+"），資料還在表單上。",true);
  }finally{saving=false;$("saveBtn").disabled=false}
};

const TOK_REPO_MSG="這組金鑰看不到私人專案 eco-field-data。請到 GitHub 金鑰設定確認：Repository access 選「Only select repositories」並勾 eco-field-data，Permissions 的 Contents 設 Read and write（可直接編輯原金鑰，不用重貼）。若你是被邀請的協作者，要改用傳統金鑰（classic，勾 repo），並確認已接受邀請。";
async function repoCheck(){
  const r=await fetch(GH_REPO_URL,{cache:"no-store",headers:{Authorization:"Bearer "+ghToken,Accept:"application/vnd.github+json"}});
  if(r.status===401){const e=new Error("401");e.code="bad_token";throw e}
  if(r.status===404||r.status===403){const e=new Error("no repo");e.code="no_repo";throw e}
  if(!r.ok){const e=new Error("GitHub "+r.status);e.code="http_"+r.status;throw e}
}
async function connect(){

  catch(e){$("conn").textContent=e.code==="bad_token"||e.code==="no_repo"?"金鑰無法使用":"讀取失敗（"+(e.code||"網路")+"）";

/* ---------- 工具內拍的原檔存到手機相簿（網頁不能直接寫相簿，透過分享選單「儲存影像」） ---------- */
let camFiles=[];
// 原檔另存一份在手機資料庫（eco-cam）：iPhone把背景網頁關掉、重開後還在，存進相簿或按刪除才清掉
let camP=null;
function camDb(){if(camP)return camP;camP=new Promise((res,rej)=>{const tm=setTimeout(()=>rej(new Error("idb_timeout")),3000);
  try{const r=indexedDB.open("eco-cam",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"k"});
    r.onsuccess=()=>{clearTimeout(tm);res(r.result)};r.onerror=r.onblocked=()=>{clearTimeout(tm);rej(r.error||new Error("idb_blocked"))}}catch(e){clearTimeout(tm);rej(e)}});
  camP.catch(()=>{camP=null});return camP}
async function camTx(mode,fn){const d=await camDb();return new Promise((res,rej)=>{const t=d.transaction("f",mode);const out=fn(t.objectStore("f"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
async function camKeep(f){const k=Date.now()+"_"+Math.random().toString(36).slice(2,7);f._k=k;
  try{const buf=await f.arrayBuffer();await camTx("readwrite",s=>s.put({k,name:f.name,type:f.type||"image/jpeg",lm:f.lastModified,buf}))}catch(e){}}
async function camLoad(){try{const all=(await camTx("readonly",s=>s.getAll()))||[];const have=new Set(camFiles.map(f=>f._k));
  all.filter(x=>!have.has(x.k)).forEach(x=>{const f=new File([x.buf],x.name||"photo.jpg",{type:x.type,lastModified:x.lm||Date.now()});f._k=x.k;camFiles.push(f)});renderAlbum()}catch(e){}}
function camDrop(list){const ks=list.map(f=>f._k).filter(Boolean);camFiles=camFiles.filter(f=>!list.includes(f));renderAlbum();
  if(ks.length)camTx("readwrite",s=>ks.forEach(k=>s.delete(k))).catch(()=>{})}
function renderAlbum(){
  const b=$("albumBtn"),ok=camFiles.length&&navigator.canShare&&navigator.canShare({files:camFiles});
  b.hidden=!ok;$("albumClr").hidden=!camFiles.length;if(ok)b.textContent=`💾 拍的 ${camFiles.length} 張原檔還沒存到手機相簿，點這裡存`;
}

/* ---------- 下載本案照片（zip，依階段分資料夾，檔名帶日期、類別、樁號） ---------- */
let zipReady=null;
function loadZip(){
  if(window.JSZip)return Promise.resolve();
  if(!zipReady)zipReady=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload=res;s.onerror=()=>{zipReady=null;rej(new Error("壓縮元件載入失敗"))};document.head.appendChild(s)});
  return zipReady;
}
const safeName=s=>String(s||"").replace(/[\\/:*?"<>|\s]+/g,"_").replace(/^_+|_+$/g,"");
// 上傳前壓縮會清掉原本的EXIF → 下載時把紀錄的GPS與拍攝時間寫回照片（最小EXIF：DateTimeOriginal＋GPS）
function exifApp1(lat,lng,dt){
  const hasLL=lat!=null&&lng!=null&&isFinite(lat)&&isFinite(lng),hasDt=/^\d{4}:\d\d:\d\d \d\d:\d\d:\d\d$/.test(dt||"");if(!hasLL&&!hasDt)return null;
  const b=new Uint8Array(400),v=new DataView(b.buffer),L=true;
  const e=(pos,tag,type,cnt,val)=>{v.setUint16(pos,tag,L);v.setUint16(pos+2,type,L);v.setUint32(pos+4,cnt,L);v.setUint32(pos+8,val,L)};
  b.set([0x49,0x49]);v.setUint16(2,42,L);v.setUint32(4,8,L);
  const n0=(hasDt?1:0)+(hasLL?1:0);v.setUint16(8,n0,L);let ep=10,q=10+n0*12+4;
  if(hasDt){e(ep,0x8769,4,1,q);ep+=12;v.setUint16(q,1,L);const s=q+18;e(q+2,0x9003,2,20,s);
    for(let i=0;i<19;i++)b[s+i]=dt.charCodeAt(i);q=s+20}
  if(hasLL){e(ep,0x8825,4,1,q);const d=q+2+60+4;v.setUint16(q,5,L);let k=q+2;
    e(k,0,1,4,0);b.set([2,3,0,0],k+8);k+=12;
    e(k,1,2,2,0);b[k+8]=lat<0?83:78;k+=12;
    e(k,2,5,3,d);k+=12;
    e(k,3,2,2,0);b[k+8]=lng<0?87:69;k+=12;
    e(k,4,5,3,d+24);
    const rat=(pos,x)=>{x=Math.abs(x);const D=Math.floor(x),mf=(x-D)*60,M=Math.floor(mf),S=Math.round((mf-M)*600000);
      [[D,1],[M,1],[S,10000]].forEach(([n,dn],i)=>{v.setUint32(pos+i*8,n,L);v.setUint32(pos+i*8+4,dn,L)})};
    rat(d,lat);rat(d+24,lng);q=d+48}
  const len=2+6+q,seg=new Uint8Array(2+len);seg.set([0xFF,0xE1,len>>8,len&255,0x45,0x78,0x69,0x66,0,0]);seg.set(b.subarray(0,q),10);return seg;
}
async function withExif(blob,lat,lng,dt){
  try{const seg=exifApp1(lat,lng,dt);if(!seg)return blob;const a=new Uint8Array(await blob.arrayBuffer());if(a[0]!==0xFF||a[1]!==0xD8)return blob;
    let at=2; // 插在JFIF(APP0)之後；已有EXIF就不動
    while(a[at]===0xFF&&(a[at+1]===0xE0||a[at+1]===0xE1)){if(a[at+1]===0xE1&&a[at+4]===0x45&&a[at+5]===0x78)return blob;at+=2+(a[at+2]<<8|a[at+3])}
    return new Blob([a.subarray(0,at),seg,a.subarray(at)],{type:"image/jpeg"})}catch(e){return blob}
}
// 照片檔名（下載zip與匯出表格共用，兩邊對得上）：階段資料夾/日期時間_類別ABCD_樁號_物種.jpg
function zipNames(list){const used=new Set();return list.map(r=>{const day=(r.takenAt||fmtMs(r.createdAt)).replace(/[\/: ]/g,"").slice(0,12);
  return r.photos.map(()=>{const name=[day,safeName(r.category)+(r.abcd||""),safeName(r.stake),safeName(r.species)].filter(Boolean).join("_");
    let k=name,j=2;while(used.has((r.stage||"")+k))k=name+"_"+j++;used.add((r.stage||"")+k);return (safeName(r.stage)||"未分階段")+"/"+k+".jpg"})})}
const exifDt=r=>{const s=r.takenAt||fmtMs(r.createdAt);return /^\d{4}\/\d\d\/\d\d \d\d:\d\d$/.test(s)?s.replace(/\//g,":")+":00":""};

  }catch(e){b.textContent="下載失敗（"+(e.message||"網路")+"）"}
  finally{b.disabled=false;setTimeout(()=>b.textContent=old,2500)}

/* ---------- 匯出：紀錄表＋當天核對結果；複製可貼Word/Excel成表格，或下載CSV ---------- */

const ymd2day=s=>s.slice(0,4)+"/"+s.slice(4,6)+"/"+s.slice(6,8);
let expDay=null;
function expData(day){
  const c=cases.find(x=>x.id===curCase)||{},chk=c.checks||[];
  const all=records.filter(r=>r.caseId===curCase).sort((a,b)=>a.createdAt-b.createdAt);
  const wp=all.filter(r=>r.photos&&r.photos.length),nm=zipNames(wp),nmOf=new Map(wp.map((r,i)=>[r,nm[i]]));

  const R1=recs.map(r=>[r.takenAt||fmtMs(r.createdAt),r.stage||"",r.category||"",r.abcd||"",r.stake||"",r.species||"",r.count||"",r.note||"",
    (chk.find(i=>i.id===r.checkId)||{}).text||"",r.lat!=null?r.lat:"",r.lng!=null?r.lng:"",r.by||"",(nmOf.get(r)||[]).join("\n")]);
  const d=day&&checkRes[curCase+"_"+day.replace(/\//g,"")];
  const lbOf=(i,k)=>i.phase==="propose"?((CHK_PROP.find(s=>s[0]===k)||[,k])[1]):i.phase==="improve"?((CHK_IMP.find(s=>s[0]===k)||[,k])[1]):stLabel(d.stage,k);
  const H2=["清單","ABCD","項目","樁號","結果","備註"];
  const R2=d?chk.filter(i=>d.st&&d.st[i.id]).map(i=>[i.phase==="propose"?"預計提出意見":i.phase==="improve"?"改善意見":"核對清單",i.abcd||"",i.text||"",i.stake||"",lbOf(i,d.st[i.id]),(d.notes||{})[i.id]||""]):[];
  return {c,H1,R1,H2,R2};

const hEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
async function copyTable(H,R,btn){
  const html=`<table border="1" style="border-collapse:collapse"><tr>${H.map(x=>`<th>${hEsc(x)}</th>`).join("")}</tr>${R.map(r=>`<tr>${r.map(x=>`<td>${hEsc(x)}</td>`).join("")}</tr>`).join("")}</table>`;
  const txt=[H,...R].map(r=>r.map(x=>String(x).replace(/[\t\n]/g," ")).join("\t")).join("\n");
  const o=btn.textContent,done=m=>{btn.textContent=m;setTimeout(()=>btn.textContent=o,1500)};
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]);done("已複製")}
  catch(e){try{await navigator.clipboard.writeText(txt);done("已複製")}catch(_){done("複製失敗")}}
}
function renderExp(){

/* Word（.docx，瀏覽器內用JSZip組OpenXML）：標題→核對結果表→照片表（每列2張，照片下附說明）→無照片紀錄表 */
async function makeDocx(day,btn){

    await loadZip();
    const {c,H2,R2}=expData(day);
    const recs=records.filter(r=>r.caseId===curCase&&(!day||recDay(r)===day)).sort((a,b)=>a.createdAt-b.createdAt);
    const X=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const RPR=(b,sz)=>`<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="標楷體"/>${b?"<w:b/>":""}<w:sz w:val="${sz||24}"/><w:szCs w:val="${sz||24}"/></w:rPr>`;
    const P=(t,{b,sz,jc}={})=>`<w:p><w:pPr><w:spacing w:before="0" w:after="60"/>${jc?`<w:jc w:val="${jc}"/>`:""}</w:pPr>${String(t==null?"":t).split("\n").map((s,i)=>`<w:r>${RPR(b,sz)}${i?"<w:br/>":""}<w:t xml:space="preserve">${X(s)}</w:t></w:r>`).join("")}</w:p>`;
    const BD=`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join("")}</w:tblBorders>`;
    const TW=9638;
    const tbl=(ws,rows)=>`<w:tbl><w:tblPr><w:tblW w:w="${TW}" w:type="dxa"/>${BD}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`+
      rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((cell,i)=>`<w:tc><w:tcPr><w:tcW w:w="${ws[i]}" w:type="dxa"/></w:tcPr>${cell||P("")}</w:tc>`).join("")}</w:tr>`).join("")+`</w:tbl>`;
    const hdr=H=>H.map(h=>P(h,{b:true,sz:20,jc:"center"}));
    const zip=new JSZip(),rels=[];let n=0,body="";
    body+=P((c.name||"")+"　現場紀錄",{b:true,sz:32,jc:"center"});
    body+=P((day?"日期："+day:"全部日期")+"　　共 "+recs.length+" 筆紀錄",{sz:22,jc:"center"});
    if(day&&R2.length){body+=P("一、核對結果",{b:true,sz:26});
      body+=tbl([1300,600,3838,1300,1100,1500],[hdr(H2),...R2.map(r=>r.map(v=>P(v,{sz:20})))])+P("")}
    // 照片：每格寬約8.2cm，直式照片限高，避免一格太長跨頁
    const cells=[],total=recs.reduce((s,r)=>s+(r.photos||[]).length,0);
    for(const r of recs)for(const id of (r.photos||[])){
      btn.textContent=`準備照片 ${n+1}/${total}…`;

let ovCtl=null,ovLayers={},ovOpacity=0.85,ovColor=lsGet("eco-ovcolor")||"#d60078";const ovTint=new Map();

async function tinted(o){

  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});

function renderOverlayCtl(c){

// 常駐樁號標籤：全部都顯示。放到最大仍重疊的合併成多行；其餘若會壓到，就往上下（再換左邊）錯開，用細線連回橘點
let mapLabels=[],labelLayer=null;
const lblText=p=>fmtSt(p.st)+(p.note?" "+p.note:"");
const lblW=t=>[...t].reduce((w,c)=>w+(c.charCodeAt(0)>255?13:7),0)+16;
const lblSize=g=>({w:Math.max(...g.lines.map(lblW)),h:g.lines.length*16+8});
const hit=(a,b)=>a.x1<b.x2&&b.x1<a.x2&&a.y1<b.y2&&b.y1<a.y2;
function relabel(){
  if(!map)return;if(labelLayer)labelLayer.remove();labelLayer=L.layerGroup().addTo(map);
  const zMax=map.getMaxZoom(),groups=[];
  const boxAt=(g,z,dx,dy,left)=>{const xy=map.project([g.lat,g.lng],z),{w,h}=lblSize(g);const x1=left?xy.x-8-w+dx:xy.x+8+dx;return {x1,x2:x1+w,y1:xy.y+dy-h/2,y2:xy.y+dy+h/2}};
  [...mapLabels].sort((a,b)=>a.st-b.st).forEach(p=>{
    const g={lat:p.lat,lng:p.lng,lines:[lblText(p)]},prev=groups[groups.length-1];
    if(prev&&hit(boxAt(prev,zMax,0,0),boxAt(g,zMax,0,0)))prev.lines.push(g.lines[0]);else groups.push(g);
  });
  const z=map.getZoom(),placed=[],slots=[];
  for(let k=0;k<=8;k++)for(const sg of k?[-1,1]:[1])slots.push(sg*k);
  groups.forEach(g=>{
    const {h}=lblSize(g);let best=null;
    for(const left of [false,true]){for(const k of slots){const b=boxAt(g,z,0,k*(h+4),left);if(!placed.some(x=>hit(x,b))){best={b,k,left};break}}if(best)break}
    if(!best)best={b:boxAt(g,z,0,0,false),k:0,left:false}; // 實在放不下也照樣顯示
    placed.push(best.b);
    const anchor=map.project([g.lat,g.lng],z),lp=L.point(best.left?best.b.x2:best.b.x1,(best.b.y1+best.b.y2)/2);
    const d=document.createElement("div");d.className="stklbl";g.lines.forEach(t=>{const l=document.createElement("div");l.textContent=t;d.appendChild(l)});
    const ll=map.unproject(lp,z);

    const {w,h:hh}=lblSize(g);
    L.marker(ll,{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:d,iconSize:[w,hh],iconAnchor:[best.left?w:0,hh/2]})}).addTo(labelLayer);
  });

/* ---------- 案件挑選器：全螢幕清單＋搜尋，最近用過的在前（底層仍是原本的select） ---------- */
function makePicker(sel,recentKey){
  if(matchMedia("(pointer:fine)").matches)return; // 電腦（滑鼠）維持原本的下拉選單，手機才用全螢幕清單
  const btn=document.createElement("button");btn.type="button";btn.className="pickbtn grow";sel.before(btn);sel.hidden=true;
  const sync=()=>{const o=sel.options[sel.selectedIndex];btn.textContent=o?o.textContent:"（尚無案件）"};
  new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true});
  const recent=()=>{try{return JSON.parse(lsGet(recentKey)||"[]")}catch(e){return []}};
  const touch=v=>{if(!v)return;lsSet(recentKey,JSON.stringify([v,...recent().filter(x=>x!==v)].slice(0,30)))};
  sel.addEventListener("change",()=>{touch(sel.value);sync()});
  setInterval(()=>{if(btn.dataset.v!==sel.value){btn.dataset.v=sel.value;sync()}},500); // 程式改value不會觸發事件
  btn.onclick=()=>{
    const opts=[...sel.options].filter(o=>o.value),rec=recent(),rank=v=>{const i=rec.indexOf(v);return i<0?1e9:i};
    const ov=document.createElement("div");ov.className="picker";
    ov.innerHTML='<div class="pkh"><input type="text" placeholder="搜尋案件名稱" aria-label="搜尋案件"><button type="button">取消</button></div><ul></ul>';
    const q=ov.querySelector("input"),ul=ov.querySelector("ul");
    const close=()=>{ov.remove();document.body.style.overflow=""};
    ov.querySelector("button").onclick=close;
    const draw=()=>{
      const k=q.value.trim().toLowerCase();ul.innerHTML="";
      const hit=opts.filter(o=>!k||o.textContent.toLowerCase().includes(k));
      const r=hit.filter(o=>rank(o.value)<1e9).sort((a,b)=>rank(a.value)-rank(b.value)),rest=hit.filter(o=>rank(o.value)>=1e9);
      const grp=(t,l)=>{if(!l.length)return;if(!k&&r.length&&rest.length){const h=document.createElement("li");h.className="grp";h.textContent=t;ul.appendChild(h)}
        l.forEach(o=>{const li=document.createElement("li");li.textContent=o.textContent;if(o.value===sel.value)li.className="on";
          li.onclick=()=>{close();if(sel.value!==o.value){sel.value=o.value;sel.dispatchEvent(new Event("change",{bubbles:true}))}};ul.appendChild(li)})};
      grp("最近使用",r);grp("其他案件",rest);
      if(!hit.length){const li=document.createElement("li");li.className="grp";li.textContent="找不到符合的案件";ul.appendChild(li)}
    };
    q.oninput=draw;draw();document.body.appendChild(ov);document.body.style.overflow="hidden";
  };
  sync();
}

  await connect();flushOutbox();
  window.addEventListener("online",()=>{renderOutbox();flushOutbox()});
  window.addEventListener("offline",renderOutbox);
  setInterval(()=>{if(outbox.length)flushOutbox()},60000);
})();
</script>
</body>
</html>
