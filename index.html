<title>生態現場紀錄</title>
<script>
// 程式出錯時直接顯示在右上角狀態（避免只看到「連線中…」）
window.addEventListener("error",e=>{const c=document.getElementById("conn");if(c)c.textContent="程式錯誤："+(e.message||"未知")+(e.lineno?"（第"+e.lineno+"行）":"")});

// LINE內建瀏覽器跟Safari分開存金鑰與定位權限 → 自動改用外部瀏覽器開（LINE支援 openExternalBrowser=1）
if(/\bLine\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search)){const u=new URL(location.href);u.searchParams.set("openExternalBrowser","1");location.replace(u.href)}
// 同事分享連結 #k=金鑰：存進這支手機後從網址拿掉（#後面的內容不會送到任何伺服器）
else{const m=location.hash.match(/[#&]k=([^&]+)/);if(m){try{localStorage.setItem("gh-token",decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,"",location.pathname+location.search)}}
// 網頁存手機（sw.js）：有新版時顯示提示條，點了才換新版（避免表單填一半被重新整理）
if("serviceWorker" in navigator&&location.protocol==="https:"){
  navigator.serviceWorker.onmessage=e=>{if(!e.data||e.data.type!=="update"||document.getElementById("updBar"))return;
    const b=document.createElement("button");b.id="updBar";b.type="button";b.textContent="有新版本，點這裡更新";
    b.style.cssText="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:14px;border-radius:10px;border:0;background:#2f6b4f;color:#fff;font:inherit;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)";
    b.onclick=()=>location.reload();document.body.appendChild(b)};
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
// ↻ 時順便檢查工具本身：網路上的版本（內嵌程式與樣式）和現在跑的不同，就換進手機副本並重新載入
const appSig=d=>[...d.querySelectorAll("script:not([src]),style")].map(e=>e.textContent).join("\n");
let appSigNow=null;document.addEventListener("DOMContentLoaded",()=>{appSigNow=appSig(document)});
async function appUpd(){
  try{const p=location.pathname.split("/").pop()||"index.html";
    const r=await fetch(p+"?swbypass="+Date.now(),{cache:"no-store"});if(!r.ok||appSigNow==null)return false;
    const t=await r.text();if(appSig(new DOMParser().parseFromString(t,"text/html"))===appSigNow)return false;
    const c=await caches.open("eco-pages-v2"); // 與 sw.js 的 CACHE 同名
    await c.put(p,new Response(t,{headers:{"Content-Type":"text/html; charset=utf-8"}}));return true
  }catch(e){return false}
}
</script>

/* 案件選單：長名中間省略（保留結尾工區編號）、右側釘選鈕、分組切換 */

<script>
// 照片類別對應各階段檢核表的照片欄：提報=表1現況照片1~9、設計=表2、開工前=表5、施工中=表9、完工=表10
// 有生態友善措施的階段，生態保護對象併到友善措施的細項（sub）；設計階段沒有友善措施，保留原大類
const CATS_BY={"提報":["植被相","水域類型","水域底質","水域型態","其他"],"設計":["生態保護對象","棲地影像","其他"],"開工前":["生態友善措施","其他"],"施工中":["生態友善措施","棲地影像","異常狀況","改善","其他"],"完工":["生態友善措施","棲地影像","其他"]};
const isFM=c=>/友善措施/.test(c||"");
// 細項：友善措施 sub＝措施種類；棲地影像 sub＝棲地／構造物，構造物再選 struct
const FM_SUBS=["生態保護對象","保留陸域","保留水域","施工便道","土方暫置","限縮開挖","渠底開孔","動物坡道","逃生設施","粗糙化/緩坡化","無落差/低落差","維持常流水","臨時沉砂池","植生復育","其他"];
const HAB_SUBS=["陸域棲地","水域棲地","整體環境","構造物"],STRUCTS=["護岸","固床工","防砂壩","洩槽","靜水池","排水溝","既有構造物","其他"];
const hasSub=c=>isFM(c)||c==="棲地影像";
// 類別完整文字（卡片、匯出、檔名共用）：生態友善措施・動物坡道 C／棲地影像・構造物・護岸
const catText=r=>[r.category||"",r.sub,r.struct].filter(Boolean).join("・")+(r.abcd?" "+r.abcd:"");
function catList(){const l=[...(CATS_BY[curStage()]||CATS_BY["施工中"])];if(cat&&!l.includes(cat))l.unshift(cat);return l}
const ABCD=[["A","迴避"],["B","縮小"],["C","減輕"],["D","補償"]];
const $=id=>document.getElementById(id);
let db=null, assets=null, cases=[], records=[], curCase="", cat="", abcd="", sub="", struct="", pending=[], editing=null, editKeep=[], saving=false;

function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* 紀錄者（兩頁共用 eco-recorder）：標題下方欄位直接輸入，新紀錄帶 by */
function who(){return lsGet("eco-recorder").trim()}
function whoShow(){$("whoIn").value=lsGet("eco-recorder")}
const whoAsk=who;
// 分享連結＝這支手機目前的金鑰（網頁無法自己產生GitHub金鑰）
function share(){
  const tok=ghToken;
  if(!tok){alert("這支手機還沒設定金鑰，無法分享。");return}
  const text="生態現場工具：用手機點這個連結，金鑰會自動設定好（請勿外傳）\n"+new URL("./",location.href).href+"#k="+encodeURIComponent(tok);
  shareBox(text);
}
function shareBox(text){
  let b=document.getElementById("shareBox");if(b)b.remove();
  b=document.createElement("div");b.id="shareBox";
  b.style.cssText="border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;background:var(--surface,var(--card));display:flex;flex-direction:column;gap:8px;font-size:13px";
  const t=document.createElement("textarea");t.readOnly=true;t.value=text;t.style.cssText="width:100%;box-sizing:border-box;min-height:70px;font:13px/1.4 monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit";
  const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  const mk=(l,f)=>{const x=document.createElement("button");x.type="button";x.className="act";x.textContent=l;x.style.cssText="padding:6px 12px";x.onclick=f;row.appendChild(x);return x};
  const st=document.createElement("span");st.style.color="var(--muted,var(--mute))";
  const cp=mk("複製",()=>{const ok=()=>{st.textContent="已複製，貼到LINE傳給同事或自己"};
    try{navigator.clipboard.writeText(text).then(ok,()=>{t.select();try{document.execCommand("copy");ok()}catch(_){st.textContent="請手動全選複製"}})}catch(_){t.select();try{document.execCommand("copy");ok()}catch(e){st.textContent="請手動全選複製"}}});
  if(navigator.share&&matchMedia("(pointer:coarse)").matches)mk("分享…",()=>navigator.share({text}).catch(()=>{}));
  mk("關閉",()=>b.remove());row.appendChild(st);
  b.append("連結含金鑰，只傳給同事或自己備份：",t,row);
  document.querySelector(".sub").after(b);
}

/* ---------- GitHub 儲存層（私人專案 eco-field-data）：模擬原本 db/assets 介面，其餘程式不用改 ----------
   cases/<caseId>.json 案件；records/<caseId>.json {紀錄id:紀錄}；checkres/<caseId>.json {核對id:結果}；files/<id> 照片與平面圖 */
// 資料專案的擁有者＝網址的帳號（xxx.github.io → xxx），搬到別的帳號/組織不用改程式
const GH_OWNER=/\.github\.io$/.test(location.hostname)?location.hostname.split(".")[0]:"tw0428";
const GH_REPO_URL=`https://api.github.com/repos/${GH_OWNER}/eco-field-data`;
const GH_API=GH_REPO_URL+"/contents/";
let ghToken=lsGet("gh-token");
async function gh(path,opt={}){
  // 訊號極差時fetch可能一直掛著：讀30秒、寫45秒逾時，逾時算網路錯誤（新紀錄會轉成待上傳）
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),opt.method&&opt.method!=="GET"?45000:30000);
  try{
    const r=await fetch(GH_API+path.split("/").map(encodeURIComponent).join("/"),{cache:"no-store",...opt,signal:ac.signal,
      headers:{Authorization:"Bearer "+ghToken,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
    if(r.status===404)return null;
    if(!r.ok){const e=new Error("GitHub "+r.status);e.code=r.status===401||r.status===403?"bad_token":r.status===409||r.status===422?"conflict":"http_"+r.status;throw e}
    return r;
  }finally{clearTimeout(tm)}
}
// 沒訊號／逾時／GitHub暫時故障 → 可以先存手機稍後重傳；金鑰錯誤等則不是

/* ---------- EXIF (JPEG) : 拍攝時間與GPS ---------- */
async function readExif(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};
    let off=2;
    while(off+4<v.byteLength){
      const mk=v.getUint16(off);if((mk&0xFF00)!==0xFF00)break;
      const len=v.getUint16(off+2);
      if(mk===0xFFE1&&v.getUint32(off+4)===0x45786966)return parseTiff(v,off+10);
      off+=2+len;
    }
  }catch(e){}
  return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949;
  const u16=o=>v.getUint16(t+o,le),u32=o=>v.getUint32(t+o,le);
  const ifd=o=>{const n=u16(o),tags={};for(let i=0;i<n;i++){const e=o+2+i*12;tags[u16(e)]={count:u32(e+4),vo:e+8}}return tags};
  const rat=(tag)=>{const o=u32(tag.vo),out=[];for(let i=0;i<tag.count;i++){const a=u32(o+i*8),b=u32(o+i*8+4);out.push(b?a/b:0)}return out};
  const asc=(tag)=>{const o=tag.count>4?u32(tag.vo):tag.vo;let s="";for(let i=0;i<tag.count;i++){const c=v.getUint8(t+o+i);if(!c)break;s+=String.fromCharCode(c)}return s};
  const out={};
  try{
    const i0=ifd(u32(4));
    if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const d=ex[0x9003]||ex[0x9004];if(d)out.taken=asc(d)}
    if(!out.taken&&i0[0x0132])out.taken=asc(i0[0x0132]);
    if(i0[0x8825]){
      const g=ifd(u32(i0[0x8825].vo));
      if(g[2]&&g[4]){
        const dms=a=>a[0]+a[1]/60+a[2]/3600;
        let lat=dms(rat(g[2])),lng=dms(rat(g[4]));
        if(g[1]&&asc(g[1])==="S")lat=-lat;
        if(g[3]&&asc(g[3])==="W")lng=-lng;
        if(lat||lng){out.lat=+lat.toFixed(6);out.lng=+lng.toFixed(6)}
      }
    }
  }catch(e){}
  return out;
}
function fmtExifTime(s){const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(s||"");return m?`${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`:""}
function fmtMs(ms){const d=new Date(ms),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ---------- 壓縮照片（長邊1920px） ---------- */
async function compress(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,s=Math.min(1,1920/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

/* ---------- 樁號推估：把GPS投影到設計中心線 ---------- */
function fmtSt(st){const k=Math.floor(st/1000),m=st-k*1000;return `${k}K+${String(Math.round(m)).padStart(3,"0")}`}
function nearestStation(lat,lng){
  const c=cases.find(x=>x.id===curCase);const s=c&&Array.isArray(c.stakes)?c.stakes:null;if(lat==null)return null;
  if((!s||s.length<2)&&c&&c.sites&&c.sites.length){ // 無樁號的案子：找最近的工區標示點
    const kx=Math.cos(lat*Math.PI/180)*111320,ky=110540;let b=null;
    c.sites.forEach(p=>{const d=Math.hypot((p.lng-lng)*kx,(p.lat-lat)*ky);if(!b||d<b.off)b={site:p.label,off:d}});return b;
  }
  if(!s||s.length<2)return null;
  const lat0=s[0].lat,kx=Math.cos(lat0*Math.PI/180)*111320,ky=110540;
  const P=p=>[(p.lng-s[0].lng)*kx,(p.lat-lat0)*ky];const q=P({lat,lng});
  let best=null;
  for(let i=0;i<s.length-1;i++){
    const a=P(s[i]),b=P(s[i+1]),dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
    let t=((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));
    const px=a[0]+t*dx,py=a[1]+t*dy,d=Math.hypot(q[0]-px,q[1]-py);
    if(!best||d<best.off)best={st:s[i].st+t*(s[i+1].st-s[i].st),off:d};
  }
  return best;
}
function fillOf(r){if(!r)return "";return r.site?(r.off<=1500?r.site:""):(r.off<=60?`約${fmtSt(r.st)}`:"")}
function stationText(r){if(!r)return "";if(r.site)return r.off>1500?`離最近工區${(r.off/1000).toFixed(1)}km，可能不在工區`:`近${r.site}（離工區標示點${Math.round(r.off)}m）`;return r.off>60?`距中心線${Math.round(r.off)}m，可能不在工區`:`約${fmtSt(r.st)}（距中心線${Math.round(r.off)}m）`}
function suggestStake(){
  const gp=pending.find(p=>p.ex.lat!=null);
  if(!gp){const c=cases.find(x=>x.id===curCase);if(pending.length&&c&&(c.stakes||c.sites)){$("stakeHint").textContent="照片無GPS，點樁號欄可從清單選";$("stakeHint").hidden=false}return}
  const r=nearestStation(gp.ex.lat,gp.ex.lng);if(!r)return;
  if(!$("stakeIn").value.trim()&&fillOf(r))$("stakeIn").value=fillOf(r);
  $("stakeHint").textContent="GPS推估："+stationText(r);$("stakeHint").hidden=false;
}

async function addFiles(list,fromCam){
  const add=[];
  for(const f of list){
    const ex=await readExif(f);
    // 照片本身沒GPS、且是剛拍的（工具內拍照）→ 用拍照當下的手機定位
    // 不用檔案修改時間判斷：從工具下載的照片再選回來，修改時間是下載當下，會誤用現在位置；改看照片內的拍攝時間
    const tk=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(ex.taken||""),tkMs=tk?new Date(+tk[1],tk[2]-1,+tk[3],+tk[4],+tk[5]).getTime():0;
    ex.fresh=ex.lat==null&&(fromCam||(tkMs&&Math.abs(Date.now()-tkMs)<300000));
    const p={file:f,url:URL.createObjectURL(f),ex};pending.push(p);add.push(p);if(fromCam){camFiles.push(f);camKeep(f)}
  }

  if(fromCam){const fm=$("recForm").getBoundingClientRect();if(fm.top<0||fm.top>innerHeight*0.6)$("pendThumbs").scrollIntoView({behavior:"smooth",block:"center"})}
  if(add.some(p=>p.ex.fresh)){
    const g=geoFresh()||await geoWait(10000);
    if(g)add.forEach(p=>{if(p.ex.fresh)Object.assign(p.ex,{lat:g.lat,lng:g.lng,acc:g.acc,src:"device"})});
    else showMsg(geoErr||"還沒取得定位，這張照片沒有GPS，可從樁號清單選位置。",true);
    renderPending();
  }
  suggestStake();
}
// 待存照片的小縮圖：一次做一張（排隊），已移除的跳過
let thQ=Promise.resolve();
function mkThumb(p){if(p._th)return;p._th=1;thQ=thQ.then(async()=>{if(!pending.includes(p))return;
  try{let src;try{src=await createImageBitmap(p.file,{imageOrientation:"from-image"})}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=p.url})}
    const s=200/Math.max(src.width,src.height),c=document.createElement("canvas");c.width=Math.max(1,Math.round(src.width*s));c.height=Math.max(1,Math.round(src.height*s));
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);if(src.close)src.close();
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.7));if(!b||!pending.includes(p))return;p.thumb=URL.createObjectURL(b);if(p._img)p._img.src=p.thumb}
  catch(e){if(p._img)p._img.src=p.url}})}

/* ---------- 批次：每張照片各一筆，說明之後補 ---------- */
$("batchBtn").onclick=async()=>{
  if(saving)return;
  if(!db||!assets){showMsg("尚未連上儲存空間，請確認已登入claude.ai並重新整理。",true);return}
  if(!curCase){showMsg("請先選擇或新增案件。",true);return}
  const f={count:$("countIn").value.trim(),species:$("spIn").value.trim(),note:$("noteIn").value.trim()};
  const manualStake=$("stakeIn").value.trim(),autoFilled=manualStake.startsWith("約");
  const by=whoAsk();
  // 按下當時的設定先固定下來：上傳中動到上面的分類、勾選也不影響這一批
  const fix={caseId:curCase,category:cat,abcd:isFM(cat)?abcd:"",sub:hasSub(cat)?sub:"",struct:cat==="棲地影像"&&sub==="構造物"?struct:"",...f,stage:curStage(),...(by?{by}:{}),...(linkCheck?{checkId:linkCheck}:{}),...($("opChk").checked?{op:true}:{})};
  const docOf=p=>{const ns=p.ex.lat!=null?nearestStation(p.ex.lat,p.ex.lng):null;
    return {...fix,stake:manualStake&&!autoFilled?manualStake:fillOf(ns),createdAt:Date.now(),takenAt:p.ex.taken?fmtExifTime(p.ex.taken):"",
      lat:p.ex.lat!=null?p.ex.lat:null,lng:p.ex.lat!=null?p.ex.lng:null,gpsSource:p.ex.lat!=null?(p.ex.src||"exif"):"none",...(p.ex.acc!=null?{gpsAcc:p.ex.acc}:{})}};
  const cmp=async p=>{try{return await compress(p.file)}catch(err){return p.file}};
  saving=true;$("saveBtn").disabled=true;$("batchBtn").disabled=true;$("recForm").classList.add("busy");
  const list=[...pending],total=list.length;let done=0,queued=0,i=0;
  // 存好的從待存區拿掉（不整個重畫，照片多時才不會卡）
  const drop=ps=>{ps.forEach(p=>{URL.revokeObjectURL(p.url);if(p.thumb)URL.revokeObjectURL(p.thumb);if(p._el)p._el.remove()});pending=pending.filter(p=>!ps.includes(p))};
  try{
    // 有訊號：照片一張張傳，紀錄每 10 筆寫一次（原本每筆都寫一次紀錄檔、整頁重畫）；壓縮下一張和上傳這一張同時進行
    if(navigator.onLine!==false){
      let grp={},gp=[],nx=cmp(list[0]);
      const flush=async()=>{if(!gp.length)return;await writeMany("records",fix.caseId,grp);done+=gp.length;drop(gp);grp={};gp=[]};
      try{
        for(;i<total;i++){
          showMsg(`上傳 ${i+1}/${total}…`);
          const blob=await nx;nx=i+1<total?cmp(list[i+1]):null;
          const id=(await assets.upload(blob)).id;
          grp[newId()]={...docOf(list[i]),photos:[id]};gp.push(list[i]);
          if(gp.length>=10)await flush();
        }
        await flush();
      }catch(e){if(!isNetErr(e))throw e;
        // 中途斷線：已傳好照片、還沒寫紀錄的轉成待上傳
        for(const [rid,d] of Object.entries(grp)){const {photos,...doc}=d;await obAddRecord(rid,doc,[],photos);queued++}drop(gp);grp={};gp=[]}
    }
    // 沒訊號（或中途斷線）剩下的：照舊一筆一筆存手機待上傳
    for(;i<total;i++){const p=list[i];if(!pending.includes(p))continue;
      showMsg(`存到手機 ${i+1}/${total}…`);
      const r=await saveNew(docOf(p),[await cmp(p)]);r==="queued"?queued++:done++;drop([p])}
    clearForm();showMsg(queued?`已存 ${done} 筆；${queued} 筆沒訊號，先存在手機（見上方「待上傳」），有訊號會自動上傳。`:`已建立 ${done} 筆紀錄，之後在列表按「編輯」補說明。`,queued>0);
  }catch(err){
    console.error(err);renderPending();
    showMsg(`已存 ${done+queued} 筆，之後失敗（${(err&&err.code)||"錯誤"}）。剩下 ${pending.length} 張還在上面，可以再按一次。`,true);
  }finally{saving=false;$("saveBtn").disabled=false;$("batchBtn").disabled=false;$("recForm").classList.remove("busy")}
};

// 網頁內自己拖的（照片牆的圖片、連結）不算：dragstart 只有頁內拖曳才會觸發
{let dn=0,inner=false;addEventListener("dragstart",()=>{inner=true});addEventListener("dragend",()=>{inner=false});
  const hasF=e=>!inner&&[...(e.dataTransfer&&e.dataTransfer.types||[])].includes("Files");
  const ov=document.createElement("div");ov.id="dropOv";ov.hidden=true;document.body.appendChild(ov);
  addEventListener("dragenter",e=>{if(!hasF(e))return;e.preventDefault();dn++;const c=cases.find(x=>x.id===curCase);ov.textContent=c?`放開即加入照片\n${c.name}\n本次階段：${curStage()}`:"請先選擇案件";ov.hidden=false});
  addEventListener("dragover",e=>{if(hasF(e))e.preventDefault()});
  addEventListener("dragleave",e=>{if(hasF(e)&&--dn<=0){dn=0;ov.hidden=true}});
  // 資料夾：逐層展開（含子資料夾）；entry 要在 drop 當下取，之後 dataTransfer 就清空了
  const isImg=f=>/^image\//.test(f.type)||/\.(jpe?g|heic|png)$/i.test(f.name);
  const readAll=d=>new Promise(res=>{const r=d.createReader(),out=[];const nx=()=>r.readEntries(es=>{if(!es.length)return res(out);out.push(...es);nx()},()=>res(out));nx()});
  const walk=async en=>{if(en.isFile)return [await new Promise(res=>en.file(res,()=>res(null)))];const out=[];for(const c of (await readAll(en)).sort((a,b)=>a.name.localeCompare(b.name)))out.push(...await walk(c));return out};
  addEventListener("drop",async e=>{if(inner){inner=false;e.preventDefault();return}if(!hasF(e))return;e.preventDefault();dn=0;ov.hidden=true;if(!curCase){showMsg("請先選擇或新增案件。",true);return}
    const ens=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);

    if(ens.some(x=>x.isDirectory)){showMsg("讀取資料夾…");fs=[];for(const en of ens)fs.push(...await walk(en))}
    fs=fs.filter(f=>f&&isImg(f));
    if(!fs.length){showMsg("拖進來的沒有照片。",true);return}showMsg("");
    if(editing)cancelEdit();addFiles(fs,false);$("pendThumbs").scrollIntoView({behavior:"smooth",block:"center"})})}

/* 地區自動帶入：案件還沒有地區、但有座標（樁號頭中尾→工區點→紀錄GPS）時，查國土測繪中心「坐標查鄉鎮村里」，存鄉鎮名（例：阿里山鄉）

   野溪常是鄉鎮界（托亞奇伊溪：阿里山鄉／那瑪夏區，實務算阿里山鄉）→ 每點都查，全部一致才自動填；

const areaTried=new Set(),areaCand={};let areaBusy=false;
async function autoArea(){
  if(areaBusy||!ghToken||navigator.onLine===false)return;areaBusy=true;
  try{for(const c of cases){
    if(c.area||areaTried.has(c.id))continue;
    const st=(Array.isArray(c.stakes)?c.stakes:[]).filter(p=>p.lat!=null);
    const pts=[st[0],st[st.length>>1],st[st.length-1],...(Array.isArray(c.sites)?c.sites:[]).filter(p=>p.lat!=null),...records.filter(r=>r.caseId===c.id&&r.lat!=null)].filter(Boolean).slice(0,5);
    if(!pts.length)continue;areaTried.add(c.id);
    const towns=new Set();
    for(const s of pts){
      try{const r=await fetch(`https://api.nlsc.gov.tw/other/TownVillagePointQuery/${s.lng}/${s.lat}/4326`);if(!r.ok)continue;
        const town=((new DOMParser().parseFromString(await r.text(),"text/xml").querySelector("townName")||{}).textContent||"").trim();
        if(town)towns.add(town)}catch(e){}
    }
    if(towns.size===1){if(!(cases.find(x=>x.id===c.id)||{}).area){try{await db.doc("cases/"+c.id).update({area:[...towns][0]})}catch(e){}}}
    else if(towns.size>1){areaCand[c.id]=[...towns];if(c.id===curCase)renderCases()}
  }}finally{areaBusy=false}

let vZoom=1,vBase=[],vToken=0;
function vApply(){

// 照片：整張放進畫面（寬高都要塞得下）並置中；平面圖PDF：照舊依寬度、往下捲
let vImg=null;
function vFit(){const st=$("vStage"),w=st.clientWidth-4;
  if(vImg){vZoom=Math.min(w/vImg.naturalWidth,(st.clientHeight-4)/vImg.naturalHeight,1.5);vApply();return}
  const mx=Math.max(...vBase.filter(Boolean),1);vZoom=w/mx;vApply()}
function vCenter(){const st=$("vStage"),b=$("vContent");if(!vImg){b.style.margin="";return}
  b.style.marginLeft=Math.max(0,(st.clientWidth-vImg.naturalWidth*vZoom)/2)+"px";b.style.marginTop=Math.max(0,(st.clientHeight-vImg.naturalHeight*vZoom)/2)+"px"}
function vSetZoom(z,cx,cy){
  const st=$("vStage"),old=vZoom;z=Math.max(0.1,Math.min(6,z));
  // 置中的留白（照片比畫面小時）要扣掉，游標下的那一點縮放後才會留在原處
  const b=$("vContent"),ml=()=>parseFloat(b.style.marginLeft)||0,mt=()=>parseFloat(b.style.marginTop)||0;
  const px=(st.scrollLeft+(cx??st.clientWidth/2)-ml())/old,py=(st.scrollTop+(cy??st.clientHeight/2)-mt())/old;

// PDF元件約1.3MB：只在真的開PDF時才下載（原本開頁就載，拖慢首次開啟）
let pdfReady=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfReady)pdfReady=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    // worker先用fetch讀（會經過sw.js、沒網路時拿手機上的副本）再轉本機網址，避免跨網域worker繞過暫存
    s.onload=async()=>{const w="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";let src=w;
      try{const r=await fetch(w);if(r.ok)src=URL.createObjectURL(new Blob([await r.text()],{type:"text/javascript"}))}catch(e){}
      pdfjsLib.GlobalWorkerOptions.workerSrc=src;res()};
    s.onerror=()=>{pdfReady=null;rej(new Error("PDF元件載入失敗，請確認網路"))};document.head.appendChild(s)});
  return pdfReady;
}
async function openViewer(id,type,title){
  vCur={id,type,title};$("vSave").hidden=!downloads;
  const tok=++vToken;$("vTitle").textContent=title;$("viewer").hidden=false;document.body.style.overflow="hidden";
  const box=$("vContent");box.innerHTML='<div class="vmsg">載入中…</div>';vBase=[];vImg=null;box.style.margin="";
  $("vFit").textContent=type==="application/pdf"?"符合寬度":"整張";
  try{
    if(type==="application/pdf"){
      await loadPdfJs();
      const buf=await (await fileBlob(id)).arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      if(tok!==vToken)return;box.innerHTML="";
      for(let n=1;n<=pdf.numPages;n++){
        const page=await pdf.getPage(n),vp=page.getViewport({scale:2});
        const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        if(tok!==vToken)return;box.appendChild(cv);vBase.push(vp.width/2);
        if(n===1)vFit();else vApply();

    }else{
      const img=new Image();img.alt=title;
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;blobUrl(id,type).then(u=>{img.src=u},rej)});
      if(tok!==vToken)return;box.innerHTML="";box.appendChild(img);vBase=[img.naturalWidth];vImg=img;img.style.marginBottom="0";vFit();
    }
  }catch(e){if(tok===vToken)box.innerHTML='<div class="vmsg">無法開啟這個檔案（'+(e.message||"載入失敗")+'）。</div>'}
}

  const dist=()=>{const p=[...pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
  // 滑鼠按住拖曳＝移動畫面：先擋掉瀏覽器原生的「拖走圖片」，不然拖不動

/* ---------- 離線包：出發前把本案平面圖、對位設計圖、照片、地圖圖磚與元件存進手機（山區沒訊號也能看） ----------
   圖磚寫進 eco-tiles、元件寫進 eco-libs，沒網路時由 sw.js 讀；平面圖與照片走 fileBlob 的 eco-files */
const TILE_CACHE="eco-tiles",LIB_CACHE="eco-libs",offKey=id=>"eco-offpack-"+id;
const OFF_LIBS=["leaflet/1.9.4/leaflet.min.css","leaflet/1.9.4/leaflet.min.js","leaflet/1.9.4/images/marker-icon.png","leaflet/1.9.4/images/marker-icon-2x.png","leaflet/1.9.4/images/marker-shadow.png","pdf.js/3.11.174/pdf.min.js","pdf.js/3.11.174/pdf.worker.min.js"].map(p=>"https://cdnjs.cloudflare.com/ajax/libs/"+p);
const tileXY=(lat,lng,z)=>{const n=2**z,r=lat*Math.PI/180;return [Math.floor((lng+180)/360*n),Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)]};
// 範圍＝樁號、點位、本案紀錄、對位設計圖外擴約300m；z13~19，超過1500格就不抓更細的層級
function offTiles(c){
  const pts=[];
  (Array.isArray(c.stakes)?c.stakes:[]).forEach(p=>{if(p.lat!=null)pts.push([p.lat,p.lng])});
  (Array.isArray(c.sites)?c.sites:[]).forEach(p=>{if(p.lat!=null)pts.push([p.lat,p.lng])});
  (Array.isArray(c.overlays)?c.overlays:[]).forEach(o=>{if(Array.isArray(o.bounds))o.bounds.forEach(b=>pts.push(b))});
  records.filter(r=>r.caseId===c.id&&r.lat!=null).forEach(r=>pts.push([r.lat,r.lng]));
  if(!pts.length)return [];
  const la=pts.map(p=>+p[0]),lo=pts.map(p=>+p[1]),dy=0.003,dx=0.003/Math.cos(la[0]*Math.PI/180);
  const N=Math.max(...la)+dy,S=Math.min(...la)-dy,W=Math.min(...lo)-dx,E=Math.max(...lo)+dx;
  const out=[];let cnt=0;
  for(let z=13;z<=19;z++){
    const [x0,y0]=tileXY(N,W,z),[x1,y1]=tileXY(S,E,z),k=(x1-x0+1)*(y1-y0+1);if(cnt+k>1500)break;cnt+=k;
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)out.push(`${z}/${y}/${x}`);
  }
  return out;
}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length)await fn(items[i++])}))}
// 存一個網址進暫存，回傳大小（bytes）；已存過就用現有的
async function cachePut(name,u){const c=await caches.open(name);const hit=await c.match(u);if(hit)return (await hit.blob()).size;
  const r=await fetch(u,{mode:"cors"});if(!r.ok)throw new Error(r.status);const b=await r.clone().blob();await c.put(u,r);return b.size}
const tileUrl=(l,k)=>`https://wmts.nlsc.gov.tw/wmts/${l}/default/GoogleMapsCompatible/${k}`;
// 每案一份紀錄 eco-offpack-<案件id>：{at,files:[照片/平面圖id],tiles:["z/y/x"],bytes,fail,noMap}，刪除時靠它知道要清哪些
function offPacks(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith("eco-offpack-"))continue;
  try{const v=JSON.parse(localStorage.getItem(k));if(v&&v.at)out.push({...v,id:k.slice(12)})}catch(e){}}}catch(e){}return out.sort((a,b)=>b.at-a.at)}
const offGet=id=>offPacks().find(p=>p.id===id)||null;
const fmtMB=b=>b>=1048576?(b/1048576).toFixed(b>=104857600?0:1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const fmtAt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
let offBusy=null; // 下載中：{id,done,total}
async function offDownload(c){
  if(offBusy)return;if(navigator.onLine===false){offErr="目前沒網路，請在有訊號的地方下載。";offRender();return}
  offErr="";try{await navigator.storage.persist()}catch(e){}
  const files=[...new Set([...(c.plans||[]).map(p=>p.id),...(c.overlays||[]).map(o=>o.id),...records.filter(r=>r.caseId===c.id).flatMap(r=>r.photos||[])].filter(Boolean))];

  const step=async f=>{try{bytes+=(await f())||0}catch(e){fail++}offBusy.done++;if(offBusy.done%10===0||offBusy.done===offBusy.total)offTick()};

    await pool(tiles.flatMap(k=>["EMAP","PHOTO2"].map(l=>tileUrl(l,k))),6,u=>step(()=>cachePut(TILE_CACHE,u)));

let recFilt="",filtCase="";
const filtOk=(r,f)=>{if(!f)return true;const [k,v]=[f.slice(0,f.indexOf(":")),f.slice(f.indexOf(":")+1)];

  const p=v.split("|");return (r.category||"")===p[0]&&(p.length<2||(r.sub||"")===p[1])&&(p.length<3||(r.struct||"")===p[2])};
function renderFilt(list){
  if(filtCase!==curCase){filtCase=curCase;recFilt=""}
  const s=$("filtSel"),cnt=f=>list.filter(r=>filtOk(r,f)).length,opts=[["",`全部（${list.length}）`]];
  const tree=new Map();list.forEach(r=>{const c=r.category||"";if(!tree.has(c))tree.set(c,new Map());const t=tree.get(c);
    if(r.sub){if(!t.has(r.sub))t.set(r.sub,new Set());if(r.struct)t.get(r.sub).add(r.struct)}});
  // 順序照分類鈕：未分類最前，類別依各階段清單，細項依選單順序
  const CO=["未分類",...new Set([...CATS_BY["施工中"],"生態保護對象",...Object.values(CATS_BY).flat()])],SO=[...FM_SUBS,...HAB_SUBS,...STRUCTS],ix=(a,x)=>{const i=a.indexOf(x);return i<0?999:i};
  [...tree.keys()].sort((a,b)=>ix(CO,a)-ix(CO,b)).forEach(c=>{opts.push(["c:"+c,`${c}（${cnt("c:"+c)}）`]);
    [...tree.get(c)].sort((a,b)=>ix(SO,a[0])-ix(SO,b[0])).forEach(([sb,st])=>{opts.push([`c:${c}|${sb}`,`　・${sb}（${cnt(`c:${c}|${sb}`)}）`]);
      [...st].forEach(x=>opts.push([`c:${c}|${sb}|${x}`,`　　・${x}（${cnt(`c:${c}|${sb}|${x}`)}）`]))})});
  const op=cnt("op:"),td=cnt("todo:");if(op)opts.push(["op:",`★意見（${op}）`]);if(td)opts.push(["todo:",`待補說明（${td}）`]);
  const stg=[...new Set(list.map(r=>r.stage||""))].filter(Boolean);if(stg.length>1)stg.forEach(x=>opts.push(["stg:"+x,`階段：${x}（${cnt("stg:"+x)}）`]));

  s.innerHTML="";opts.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;o.selected=v===recFilt;s.appendChild(o)});
  s.classList.toggle("on",!!recFilt);

}

  const f={stake:$("stakeIn").value.trim(),count:$("countIn").value.trim(),species:$("spIn").value.trim(),note:$("noteIn").value.trim()};
  if(!pending.length&&!f.species&&!f.note&&!f.stake&&!editing){showMsg("至少拍一張照片或填一個欄位。",true);return}
  if(pending.length&&!assets){showMsg("這個檢視無法上傳照片（需用你自己的帳號開啟）。",true);return}

    const blobs=[];

    if(pending.some(p=>p.ex.fresh&&p.ex.lat==null)){showMsg("等待定位…");const g=geoFresh()||await geoWait(10000);
      if(g)pending.forEach(p=>{if(p.ex.fresh&&p.ex.lat==null)Object.assign(p.ex,{lat:g.lat,lng:g.lng,acc:g.acc,src:"device"})})}
    const gp=pending.find(p=>p.ex.lat!=null);const tp=pending.find(p=>p.ex.taken);
    // 樁號欄空白但有GPS：存檔時補上推估樁號（離中心線60m內才補）

    const body={caseId:curCase,category:cat,abcd:isFM(cat)?abcd:"",sub:hasSub(cat)?sub:"",struct:cat==="棲地影像"&&sub==="構造物"?struct:"",...f};

    if($("opChk").checked)body.op=true;else if(editing&&editing.op)body.op=false;
    if(!editing){body.stage=curStage();const by=whoAsk();if(by)body.by=by}
    // 列入改善追蹤：先在改善意見清單加一條，這筆紀錄連到它
    let impFail=false,impAdded=false;

      const c=cases.find(x=>x.id===curCase),d=new Date(),by=who();
      const item={id:"u"+Date.now().toString(36),abcd:"",text:f.note||f.species||"（待補說明）",stake:f.stake,
        src:`現場紀錄 ${d.getMonth()+1}/${d.getDate()}`+(by?" "+by:""),phase:"improve",added:true};
      if(c&&await saveChecks([...(c.checks||[]),item])){body.checkId=item.id;impAdded=true}else impFail=true;
    }
    let queued=false;
    if(editing){ // 編輯既有紀錄需要網路（不進待上傳）
      const ids=[];
      for(let i=0;i<blobs.length;i++){showMsg(`上傳照片 ${i+1}/${blobs.length}…`);ids.push((await assets.upload(blobs[i])).id)}
      const upd={...body,photos:[...editKeep,...ids]};
      const removed=(editing.photos||[]).filter(p=>!editKeep.includes(p));
      if(editing.lat==null&&gp){upd.lat=gp.ex.lat;upd.lng=gp.ex.lng;upd.gpsSource=gp.ex.src||"exif";if(gp.ex.acc!=null)upd.gpsAcc=gp.ex.acc}

      showMsg(blobs.length?`上傳照片（${blobs.length} 張）…`:"儲存中…");
      const doc={...body,createdAt:Date.now(),takenAt:tp?fmtExifTime(tp.ex.taken):"",

    }
    clearForm();
    showMsg((queued?"沒訊號，已先存在手機（見上方「待上傳」），有訊號時會自動上傳。":gp||!blobs.length?"已儲存。":"已儲存。照片沒有帶GPS，記得在樁號欄補位置。")+(impFail?"（改善追蹤項目沒加成功，有訊號時到「改善意見」手動新增）":impAdded?"已列入改善意見清單。":""),queued||impFail||(!gp&&blobs.length>0));
  }catch(err){
    const c=err&&err.code;
    showMsg(editing&&isNetErr(err)?"編輯既有紀錄需要網路，資料還在表單上，有訊號時再按一次。":"儲存失敗（"+(c||"錯誤")+"），資料還在表單上。",true);
  }finally{saving=false;$("saveBtn").disabled=false}
};

let camP=null;
function camDb(){if(camP)return camP;camP=new Promise((res,rej)=>{const tm=setTimeout(()=>rej(new Error("idb_timeout")),3000);
  try{const r=indexedDB.open("eco-cam",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"k"});
    r.onsuccess=()=>{clearTimeout(tm);res(r.result)};r.onerror=r.onblocked=()=>{clearTimeout(tm);rej(r.error||new Error("idb_blocked"))}}catch(e){clearTimeout(tm);rej(e)}});
  camP.catch(()=>{camP=null});return camP}
async function camTx(mode,fn){const d=await camDb();return new Promise((res,rej)=>{const t=d.transaction("f",mode);const out=fn(t.objectStore("f"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
async function camKeep(f){const k=Date.now()+"_"+Math.random().toString(36).slice(2,7);f._k=k;
  try{const buf=await f.arrayBuffer();await camTx("readwrite",s=>s.put({k,name:f.name,type:f.type||"image/jpeg",lm:f.lastModified,buf}))}catch(e){}}

  all.filter(x=>!have.has(x.k)).forEach(x=>{const f=new File([x.buf],x.name||"photo.jpg",{type:x.type,lastModified:x.lm||Date.now()});f._k=x.k;camFiles.push(f)});renderAlbum()}catch(e){}}

let srtOn=false,srtFM=false,srtBusy=false;const srtSel=new Set();
function srtBar(bar,list){
  bar.innerHTML="";const sel=list.filter(r=>srtSel.has(r.id));
  const n=document.createElement("span");n.className="hint";n.style.flex="none";n.textContent=sel.length?`已選 ${sel.length} 筆`:"點照片勾選（可多選）";bar.appendChild(n);
  if(!sel.length){srtFM=false;return}
  const stg=[...new Set(sel.map(r=>r.stage||"施工中"))],cats=CATS_BY[stg.length===1?stg[0]:curStage()]||CATS_BY["施工中"];
  const box=document.createElement("div");box.className="chips";
  const mk=(t,on,f)=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;b.setAttribute("aria-pressed",String(!!on));b.onclick=f;box.appendChild(b)};
  // 逐步選：類別 →（友善措施）措施種類 → ABCD；（棲地影像）棲地／構造物 → 構造物種類
  const go=st=>{srtFM=st;srtBar(bar,list)},back=st=>mk("← 上一步",false,()=>go(st));
  const s=srtFM||{};
  if(!srtFM)cats.forEach(c=>mk(c,false,()=>hasSub(c)?go({c}):srtApply(bar,list,{category:c})));
  else if(isFM(s.c)&&!s.sub){back(false);FM_SUBS.forEach(x=>mk(x,false,()=>srtApply(bar,list,{category:s.c,sub:x})))}
  else if(!s.sub){back(false);HAB_SUBS.forEach(x=>mk(x,false,()=>x==="構造物"?go({c:s.c,sub:x}):srtApply(bar,list,{category:s.c,sub:x})))}
  else{back({c:s.c});STRUCTS.forEach(x=>mk(x,false,()=>srtApply(bar,list,{category:s.c,sub:"構造物",struct:x})))}
  if(srtFM){const h=document.createElement("span");h.className="hint";h.textContent=[s.c,s.sub].filter(Boolean).join("・")+" →";box.prepend(h)}

      catch(e){showMsg("合併失敗（"+((e&&e.code)||"網路")+"），再試一次。",true)}

/* ---------- 下載本案照片（zip，依階段分資料夾，檔名帶日期、類別、樁號） ---------- */
let zipReady=null;

}
const safeName=s=>String(s||"").replace(/[\\/:*?"<>|\s]+/g,"_").replace(/^_+|_+$/g,"");

function exifApp1(lat,lng,dt){

  if(hasDt){e(ep,0x8769,4,1,q);ep+=12;v.setUint16(q,1,L);const s=q+18;e(q+2,0x9003,2,20,s);
    for(let i=0;i<19;i++)b[s+i]=dt.charCodeAt(i);q=s+20}

    e(k,0,1,4,0);b.set([2,3,0,0],k+8);k+=12;
    e(k,1,2,2,0);b[k+8]=lat<0?83:78;k+=12;
    e(k,2,5,3,d);k+=12;
    e(k,3,2,2,0);b[k+8]=lng<0?87:69;k+=12;
    e(k,4,5,3,d+24);
    const rat=(pos,x)=>{x=Math.abs(x);const D=Math.floor(x),mf=(x-D)*60,M=Math.floor(mf),S=Math.round((mf-M)*600000);

}
// 照片檔名（下載zip與匯出表格共用，兩邊對得上）：階段資料夾/日期時間_類別ABCD_樁號_物種.jpg
function zipNames(list){const used=new Set();return list.map(r=>{const day=(r.takenAt||fmtMs(r.createdAt)).replace(/[\/: ]/g,"").slice(0,12);
  return r.photos.map(()=>{const name=[day,safeName([r.category,r.sub,r.struct].filter(Boolean).join("-"))+(r.abcd||""),safeName(r.stake),safeName(r.species)].filter(Boolean).join("_");
    let k=name,j=2;while(used.has((r.stage||"")+k))k=name+"_"+j++;used.add((r.stage||"")+k);return (safeName(r.stage)||"未分階段")+"/"+k+".jpg"})})}

const hEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");

      rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((cell,i)=>`<w:tc><w:tcPr><w:tcW w:w="${ws[i]}" w:type="dxa"/></w:tcPr>${cell||P("")}</w:tc>`).join("")}</w:tr>`).join("")+`</w:tbl>`;

// 常駐樁號標籤：全部都顯示。放到最大仍重疊的合併成多行；其餘若會壓到，就往上下（再換左邊）錯開，用細線連回橘點
let mapLabels=[],labelLayer=null;
const lblText=p=>fmtSt(p.st)+(p.note?" "+p.note:"");
const lblW=t=>[...t].reduce((w,c)=>w+(c.charCodeAt(0)>255?13:7),0)+16;
const lblSize=g=>({w:Math.max(...g.lines.map(lblW)),h:g.lines.length*16+8});
const hit=(a,b)=>a.x1<b.x2&&b.x1<a.x2&&a.y1<b.y2&&b.y1<a.y2;
function relabel(){
  if(!map)return;if(labelLayer)labelLayer.remove();labelLayer=L.layerGroup().addTo(map);
  const zMax=map.getMaxZoom(),groups=[];
  const boxAt=(g,z,dx,dy,left)=>{const xy=map.project([g.lat,g.lng],z),{w,h}=lblSize(g);const x1=left?xy.x-8-w+dx:xy.x+8+dx;return {x1,x2:x1+w,y1:xy.y+dy-h/2,y2:xy.y+dy+h/2}};
  [...mapLabels].sort((a,b)=>a.st-b.st).forEach(p=>{
    const g={lat:p.lat,lng:p.lng,lines:[lblText(p)]},prev=groups[groups.length-1];
    if(prev&&hit(boxAt(prev,zMax,0,0),boxAt(g,zMax,0,0)))prev.lines.push(g.lines[0]);else groups.push(g);
  });

    for(const left of [false,true]){for(const k of slots){const b=boxAt(g,z,0,k*(h+4),left);if(!placed.some(x=>hit(x,b))){best={b,k,left};break}}if(best)break}
    if(!best)best={b:boxAt(g,z,0,0,false),k:0,left:false}; // 實在放不下也照樣顯示
    placed.push(best.b);

    const {w,h:hh}=lblSize(g);

  });

    const draw=()=>{
      const mode=lsGet("eco-pickmode")||"recent";
      seg.innerHTML="";[["recent","最近使用"],["area","地區"],["stage","階段"]].forEach(([m,t])=>{const b=document.createElement("button");b.type="button";b.textContent=t;
        b.className=m===mode?"on":"";b.setAttribute("aria-pressed",String(m===mode));b.onclick=()=>{lsSet("eco-pickmode",m);draw()};seg.appendChild(b)});
      const k=q.value.trim().toLowerCase();ul.innerHTML="";
      const hit=opts.filter(o=>!k||o.textContent.toLowerCase().includes(k)),byRank=(a,b)=>rank(a.value)-rank(b.value)||a.textContent.localeCompare(b.textContent,"zh-Hant");
      const head=t=>{const h=document.createElement("li");h.className="grp";h.textContent=t;ul.appendChild(h)};
      const item=o=>{const li=document.createElement("li");if(o.value===sel.value)li.className="on";
        const nm=document.createElement("span");nm.className="pkname";nameEl(nm,o.textContent);
        const pb=document.createElement("button");pb.type="button";pb.className="pin";const on=isPin(o);pb.textContent=on?"📌":"☆";pb.setAttribute("aria-label",on?"取消釘選":"釘選");
        pb.onclick=e=>{e.stopPropagation();togglePin(o);draw()};
        li.append(nm,pb);li.onclick=()=>{close();if(sel.value!==o.value){sel.value=o.value;sel.dispatchEvent(new Event("change",{bubbles:true}))}};ul.appendChild(li)};
      const P=hit.filter(isPin).sort(byRank),R=hit.filter(o=>!isPin(o));
      if(P.length){head("📌 釘選");P.forEach(item)}
      if(k){R.sort(byRank).forEach(item)}
      else if(mode==="recent"){const r=R.filter(o=>rank(o.value)<1e9).sort(byRank),rest=R.filter(o=>rank(o.value)>=1e9).sort(byRank);
        if(r.length){head("最近使用");r.forEach(item)}if(rest.length){head("其他案件");rest.forEach(item)}}
      else{const key=o=>metaOf(o.value)[mode]||"",keys=[...new Set(R.map(key))];
        keys.sort((a,b)=>!a?1:!b?-1:mode==="stage"?PICK_STAGES.indexOf(a)-PICK_STAGES.indexOf(b):a.localeCompare(b,"zh-Hant"));
        keys.forEach(g=>{head(g||(mode==="area"?"未設定地區":"未設定階段"));R.filter(o=>key(o)===g).sort(byRank).forEach(item)})}
      if(!hit.length)head("找不到符合的案件");
    };
    q.oninput=draw;draw();document.body.appendChild(ov);document.body.style.overflow="hidden";
  };
  sync();
}
// 階段沒選過＝畫面上預設的施工中（同curStage），分組也照這個
makePicker($("caseSel"),"eco-recent-field",id=>{const c=cases.find(x=>x.id===id)||{};return {name:c.name||"",area:c.area||"",stage:lsGet("eco-stage-"+id)||c.stage||"施工中"}});

whoShow();
$("whoIn").oninput=e=>lsSet("eco-recorder",e.target.value);
$("shareBtn").onclick=e=>{e.preventDefault();share()};
(async()=>{
  db.collection("cases").orderBy("createdAt").onSnapshot(s=>{cases=s.docs.map(d=>({id:d.id,...d.data()}));renderCases();renderRecords()},
    ()=>{$("conn").textContent="連線中斷，請重新整理"});
  db.collection("records").onSnapshot(s=>{records=s.docs.map(d=>({id:d.id,...d.data()}));renderCases();renderRecords();setTimeout(autoArea,1500)},
    ()=>{$("conn").textContent="連線中斷，請重新整理"});
  // 待上傳的核對結果蓋在雲端資料上面，重新讀取時不會被舊資料覆蓋
  db.collection("checkres").onSnapshot(s=>{checkRes={};s.docs.forEach(d=>{checkRes[d.id]=d.data()});outbox.filter(x=>x.kind==="check").forEach(x=>{checkRes[x.rid]=x.doc});renderChecks()},()=>{});
  if(ghToken)loadCache();
  camLoad();obLoad().then(renderOutbox); // 不等待：手機資料庫卡住也不影響連線
  await connect();flushOutbox();
  window.addEventListener("online",()=>{renderOutbox();flushOutbox()});
  window.addEventListener("offline",renderOutbox);
  setInterval(()=>{if(outbox.length)flushOutbox()},60000);
})();
